name: FoodRadar 02｜網站部署
run-name: 'FoodRadar 02｜網站部署｜#${{ github.run_number }}'
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: foodradar-pages-deployment
  cancel-in-progress: true
jobs:
  release:
    name: 單一資料庫及完整網站驗收成功後才上線
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, 'FR_VERIFY_STORAGE_GC_ONCE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: 取得程式（絕不開啟任何 UE 爬蟲）
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝現有資料庫程式
        run: pip install -r requirements.txt 'huggingface_hub>=0.30,<2' 'zstandard>=0.23,<1' 'msgpack>=1,<2'
      - name: 驗證未來每批的共用商品、60天失效資料清除與 State 接續
        run: |
          python -m unittest discover -s tests -p 'test_compact_repack.py' -v
          python -m unittest discover -s tests -p 'test_storage_checkpoint_migration.py' -v
          python -m unittest discover -s tests -p 'test_relational_overlay_v9.py' -v
          python -m unittest discover -s tests -p 'test_hf_retention.py' -v
          python -m unittest discover -s tests -p 'test_storage_lifecycle.py' -v
      - name: 從 HF 恢復已驗證資料庫（完全不發 UE 請求）
        run: python src/hf_retention.py restore
      - name: 驗證後續批次能接續舊 HF State，不會發生契約失配而重爬
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from state_checkpoint import direct_contract_digest,compatible_direct_contract
          meta=json.loads(Path('data/state-checkpoint/manifest.json').read_text())
          print('FR_FUTURE_STATE_CONTRACT='+json.dumps({'recorded':meta.get('contract_digest'),'current':direct_contract_digest(),'compatible':compatible_direct_contract(meta)},sort_keys=True),flush=True)
          if not compatible_direct_contract(meta):
              raise SystemExit('Existing HF State does not match future stage-17 contract')
          PY
      - name: 正規化商品與價格，保留所有店家原生紀錄
        run: |
          python scripts/build_relational_overlay_v9.py --checkpoint data/state-checkpoint --output data/relational-release.db --report data/relational-build.json
      - name: 裁減商品重複資料、壓縮字典與價格歷史、校驗 SQL 關聯
        run: |
          python scripts/slim_relational_sqlite.py --database data/relational-release.db
          python scripts/publish_relational_overlay_v9.py --file data/relational-release.db
      - name: 先發布不可變 SQL 候選檔到 HF（不變更現有網站）
        run: python scripts/publish_relational_overlay_v9.py --file data/relational-release.db --publish
      - name: Node 與唯讀 SQLite WASM
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 編譯唯讀 SQL VFS 並驗證原網站 JavaScript
        run: |
          npm install --no-save --ignore-scripts sql.js-httpvfs@0.8.12 esbuild@0.27.0 playwright@1.65.1
          mkdir -p web/vendor
          npx esbuild web/relational-v6-vfs-entry.js --bundle --format=esm --platform=browser --outfile=web/vendor/relational-vfs.mjs --minify
          cp node_modules/sql.js-httpvfs/dist/sqlite.worker.js web/vendor/sqlite.worker.js
          cp node_modules/sql.js-httpvfs/dist/sql-wasm.wasm web/vendor/sql-wasm.wasm
          node --check web/app.js
          node --check web/sqlite-catalog.js
          node --check web/sqlite-storage.js
          npx playwright install --with-deps chromium
      - name: 設定單一 SQLite 預覽入口（不產生第三份網站商品資料）
        run: python scripts/configure_sqlite_site.py --pointer DB/preview.json
      - name: 以原生批次設定首頁版本並防止資料回退
        run: |
          batch=$(python - <<'PY'
          import sqlite3,json
          with sqlite3.connect("data/relational-release.db") as db:
              print(json.loads(db.execute("SELECT value FROM relational_meta WHERE key='batch'").fetchone()[0]))
          PY
          )
          python scripts/build_sqlite_site_version.py --batch "$batch"
      # SQL-specific homepage smoke test must not import the old static data client.
      - name: Chrome 先驗證全部首頁 API、查詢、歷史與 SQLite CORS
        run: |
          (cd web && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fr-sqlite-http.log 2>&1 &)
          sleep 3
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
          node tests/test_relational_browser_v9.cjs
          node tests/test_relational_main_browser.cjs
      - name: 網站驗收過關後才啟用新的 HF DB/current.json
        run: python scripts/activate_relational_sqlite.py
      - name: 新站切換正式 DB（仍然零 Pages 商品資料）
        run: python scripts/configure_sqlite_site.py --pointer DB/current.json
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上傳僅有網頁、程式、SQLite WASM 的 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: fr-hf-sqlite-${{ github.run_attempt }}
      - name: 等待 Pages Artifact 完成索引再部署
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: fr-hf-sqlite-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          base=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}'
          url=base+f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}/artifacts?per_page=100'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          for attempt in range(30):
              try:
                  with urlopen(Request(url,headers=headers),timeout=20) as res:
                      items=json.load(res).get('artifacts',[])
                  matches=[x for x in items if x['name']==os.environ['ARTIFACT']
                           and not x.get('expired') and x.get('size_in_bytes',0)>0]
                  if len(matches)==1:
                      print('FR_SQLITE_PAGES_ARTIFACT_INDEXED='+json.dumps({
                          'artifact_id':matches[0]['id'],
                          'size':matches[0]['size_in_bytes'],
                          'attempt':attempt+1}),flush=True)
                      # REST index may precede internal Pages deployment index.
                      time.sleep(15)
                      break
                  if len(matches)>1:raise ValueError('Ambiguous Pages artifact')
                  print('GitHub 正在建立本次 Pages Artifact 索引',attempt+1,flush=True)
              except Exception as error:
                  print('Artifact 索引尚未可用',str(error)[:150],flush=True)
              time.sleep(5)
          else:raise SystemExit('No indexed Pages artifact; prevent stale deployment')
          PY
      - name: 正式部署
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: fr-hf-sqlite-${{ github.run_attempt }}
      - name: 線上再驗收原完整網站與歷史紀錄
        env:
          FR_TEST_BASE: https://fafagoback.github.io/FoodRadar/
        run: node tests/test_relational_main_browser.cjs
      - name: 只保存短期測試結果，不保存重複商品資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-single-db-audit
          path: |
            data/relational-build.json
            fr-sqlite-full-site.png
            fr-sqlite-full-site-failure.png
            fr-hf-sqlite-browser.png
          if-no-files-found: ignore
          retention-days: 5
