name: FoodRadar 02｜網站部署
run-name: 'FoodRadar 02｜網站部署｜執行編號 #${{ github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '已通過資料稽核的 01 執行 ID'
        required: true
        type: string
      source_sha:
        description: '來源 01 的完整 commit SHA'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: foodradar-pages-deployment
  cancel-in-progress: true
jobs:
  ingest-gate:
    name: 確認爬蟲實際成功發布資料
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.verify.outputs.published }}
    steps:
      - name: 只允許實際完成的資料更新觸發網站部署
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, time
          from urllib.request import Request, urlopen
          run_id = os.environ["SOURCE_RUN_ID"]
          sha = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9]+", run_id) or not re.fullmatch(r"[a-f0-9]{40}", sha):
              raise SystemExit("無效來源執行 ID 或版本")
          if sha != os.environ["CURRENT_SHA"]:
              raise SystemExit("來源版本已過期，不得部署")
          base = f'https://api.github.com/repos/{os.environ["GH_REPOSITORY"]}'
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def read(path):
              with urlopen(Request(base + path, headers=headers), timeout=15) as response:
                  return json.load(response)
          for _ in range(60):
              source = read(f"/actions/runs/{run_id}")
              if (source.get("head_branch") != "main" or source.get("head_sha") != sha
                  or source.get("path", "").split("@")[0] != ".github/workflows/crawl.yml"):
                  raise SystemExit("非本次正式資料更新，禁止部署")
              if source.get("status") == "completed":
                  break
              time.sleep(3)
          else:
              raise SystemExit("資料更新尚未完成，禁止部署")
          if source.get("conclusion") != "success":
              raise SystemExit("資料更新未成功，禁止部署")
          jobs = []
          for page in range(1, 5):
              chunk = read(f"/actions/runs/{run_id}/jobs?per_page=100&page={page}").get("jobs", [])
              jobs.extend(chunk)
              if len(chunk) < 100:
                  break
          allowed = any(j.get("name", "").startswith("第十六台｜彙整驗證")
                        and j.get("conclusion") == "success"
                        and any(s.get("name") == "保存已驗證靜態資料為 Pages 來源 Artifact"
                                and s.get("conclusion") == "success"
                                for s in j.get("steps", [])) for j in jobs)
          if not allowed:
              raise SystemExit("資料包尚未完整驗證，禁止部署")
          if read("/branches/main")["commit"]["sha"] != sha:
              raise SystemExit("來源版本已過期，不得部署")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f'published={str(allowed).lower()}\n')
          print('VERIFIED_INGEST_DEPLOY_GATE=' + str(allowed))
          PY

  deploy:
    name: 部署最新程式與已驗證資料版本
    needs: [ingest-gate]
    if: ${{ needs.ingest-gate.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 取得最新驗證通過的爬蟲資料包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-static-source
          # Only the completed and verified crawl run may supply a deployment.
          # Never reuse an older artifact or start a deployment from a code push.
          test -n "$SOURCE_RUN_ID" || { echo '爬蟲尚未完成，禁止部署' >&2; exit 1; }
          echo "FOODRADAR_ARTIFACT_SOURCE_RUN=$SOURCE_RUN_ID"
          gh run download "$SOURCE_RUN_ID" --name foodradar-static-source --dir pages-static-source
          test -s pages-static-source/current.json
          test -d pages-static-source/blobs
      - name: 建立網站用的靜態地理查詢資料
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          pip install 'zstandard>=0.23,<1'
          python scripts/configure_web.py
          python scripts/prepare_pages.py --staging pages-static-source
      - name: 禁止舊爬蟲批次覆蓋網站最新資料
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          candidate=json.loads(Path('web/version.json').read_text(encoding='utf-8'))
          url='https://fafagoback.github.io/FoodRadar/version.json?freshness='+candidate['version']
          try:
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as response:
                  previous=json.load(response)
          except HTTPError as e:
              if e.code != 404:
                  raise
              previous={}
          except URLError as e:
              raise RuntimeError('Cannot check currently published batch: refuse uncertain overwrite') from e
          old=str(previous.get('batch') or '')
          current=str(candidate['batch'])
          if old and old > current:
              raise RuntimeError(f'Stale crawler artifact: published {old}, attempted {current}')
          print('FOODRADAR_LATEST_BATCH_GUARD='+json.dumps({
              'published_batch':old,'candidate_batch':current,'allowed':True
          }),flush=True)
          PY
      - name: 準備網站發布設定
        uses: actions/configure-pages@v5
      - name: 上傳網站資料包
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      - name: 確認本次網站資料包已完成索引
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json,os,time
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError,URLError
          base=f'https://api.github.com/repos/{os.environ["GH_REPO"]}'
          name=os.environ["PAGES_ARTIFACT"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          url=base+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]+"/artifacts?per_page=100"
          for attempt in range(24):
              try:
                  with urlopen(Request(url,headers=headers),timeout=15) as response:
                      artifacts=json.load(response).get("artifacts",[])
                  matches=[x for x in artifacts if x.get("name")==name and not x.get("expired")]
                  if len(matches)>1:
                      raise RuntimeError("本次部署資料包不應重複")
                  if len(matches)==1 and matches[0].get("size_in_bytes",0)>0:
                      print("FOODRADAR_PAGES_ARTIFACT_INDEXED="+json.dumps({
                          "name":name,"id":matches[0]["id"],"bytes":matches[0]["size_in_bytes"]
                      }),flush=True)
                      # Artifact metadata is eventually consistent across the
                      # public REST and internal Pages deployment services.
                      time.sleep(15)
                      break
              except (HTTPError,URLError) as e:
                  print("等待 GitHub 資料包索引",type(e).__name__,flush=True)
              time.sleep(5)
          else:
              raise SystemExit("本次網站資料包尚未完成索引，禁止發布")
          PY
      - name: 發布 GitHub Pages 網站
        uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: 確認線上版本與本次資料批次一致
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import urlopen, Request
          from pathlib import Path
          expected = json.loads(Path('web/version.json').read_text(encoding='utf-8'))
          base = 'https://fafagoback.github.io/FoodRadar/'
          for attempt in range(12):
              try:
                  url = base + 'version.json?_release=' + expected['version'] + '-' + str(attempt)
                  with urlopen(Request(url, headers={'Cache-Control':'no-cache'}), timeout=20) as response:
                      manifest = json.load(response)
                  # A successful deploy must contain the exact crawler batch,
                  # not only the matching Git commit; the same code may serve
                  # many scheduled data refreshes every day.
                  if all(manifest.get(key) == expected.get(key)
                         for key in ('commit','batch','data_revision','version')):
                      print('FOODRADAR_LIVE_VERSION=' + json.dumps(manifest, ensure_ascii=False), flush=True)
                      break
              except Exception as error:
                  print('頁面版號重試', type(error).__name__, str(error)[:180], flush=True)
              if attempt == 11:
                  raise SystemExit('發布後網頁版號不符合這次部署')
              time.sleep(6)
          PY

      - name: 保存部署報告用的真實資料
        if: ${{ !cancelled() }}
        run: |
          mkdir -p action-reports/metrics
          if [ -s web/version.json ]; then cp web/version.json action-reports/metrics/version.json; fi
          if [ -s web/data/manifest.json ]; then cp web/data/manifest.json action-reports/metrics/manifest.json; fi
      - name: 上傳網站部署指標
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-deploy-metrics
          overwrite: true
          path: action-reports/metrics/
          if-no-files-found: warn
          retention-days: 5


  report:
    name: 產生中文網站部署總報告
    needs: [ingest-gate, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: 下載本次部署指標
        if: ${{ needs.deploy.result == 'success' }} 
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: foodradar-deploy-metrics
          path: action-reports/metrics
      - name: 產生繁體中文網站部署總報告
        env:
          GATE_RESULT: ${{ needs.ingest-gate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: python scripts/action_summary.py pages

  cleanup-artifacts:
    name: 清理已無用途的歷史資料包
    needs: [ingest-gate, deploy, report]
    if: ${{ success() && needs.ingest-gate.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: 保留本次正式版本並清除已被取代的 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              with urlopen(Request(base + path, headers=headers, method=method), timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def paginated(path, key):
              page = 1
              while True:
                  sep = '&' if '?' in path else '?'
                  values = api(f'{path}{sep}per_page=100&page={page}')[key]
                  yield from values
                  if len(values) < 100:
                      break
                  page += 1

          def workflow(run):
              return run.get('path', '').split('@')[0]

          source_id = int(os.environ['SOURCE_RUN_ID'])
          pages_id = int(os.environ['GITHUB_RUN_ID'])
          source = api(f'/actions/runs/{source_id}')
          pages = api(f'/actions/runs/{pages_id}')
          assert workflow(source) == '.github/workflows/crawl.yml'
          assert workflow(pages) == '.github/workflows/pages.yml'
          assert source['status'] == 'completed' and source['conclusion'] == 'success'
          assert source['head_branch'] == pages['head_branch'] == 'main'
          assert source['head_sha'] == pages['head_sha']

          # 確認同一次資料來源與部署包仍存在；缺少任何一項則不刪除。
          artifacts = list(paginated('/actions/artifacts', 'artifacts'))
          def owner(a):
              return (a.get('workflow_run') or {}).get('id')
          def exists(run_id, name):
              return any(owner(a) == run_id and a['name'] == name and not a['expired']
                         and a['size_in_bytes'] > 0 for a in artifacts)
          assert exists(source_id, 'foodradar-static-source'), '本次資料來源包不存在'
          assert exists(pages_id, 'github-pages-' + os.environ['GITHUB_RUN_ATTEMPT']), '本次部署包不存在'

          runs = {r['id']: r for r in paginated('/actions/runs', 'workflow_runs')}
          runs[source_id] = source
          runs[pages_id] = pages
          # 有其他部署正在執行時，避免移除任何可能被該部署讀取的來源。
          other_deploy = any(workflow(r) == '.github/workflows/pages.yml'
                             and r['id'] != pages_id and r['status'] != 'completed'
                             for r in runs.values())

          merged = {}
          def raw_saved(run_id):
              if run_id not in merged:
                  jobs = paginated(f'/actions/runs/{run_id}/jobs', 'jobs')
                  merged[run_id] = any(
                      step.get('name') == '交叉核對店家覆蓋率與原始 HTTP SHA-256，統一上傳 HF Raw'
                      and step.get('conclusion') == 'success'
                      for job in jobs for step in (job.get('steps') or []))
              return merged[run_id]

          crawl_reports = {'foodradar-data-validation', 'foodradar-run-metrics'}
          page_reports = {'foodradar-deploy-metrics', 'foodradar-pages-browser-diagnostics'}
          targets = []
          for a in artifacts:
              if a['expired']:
                  continue
              rid, name = owner(a), a['name']
              r = runs.get(rid)
              if not r or r.get('head_branch') != 'main' or r['status'] != 'completed':
                  continue
              if workflow(r) == '.github/workflows/crawl.yml':
                  if r['run_number'] > source['run_number']:
                      continue
                  raw = (re.fullmatch(r'foodradar-shared-feed(?:-[0-9a-f]{16})?', name)
                         or re.fullmatch(r'foodradar-raw-shard-(?:[0-9a-f]{16}-)?\d+', name)
                         or re.fullmatch(r'fr-task-[0-9a-f]{16}-[0-9a-f-]{36}-[0-9a-f]{32}', name)
                         or re.fullmatch(r'fr-worker-[0-9a-f]{16}-\d+(?:-w\d{2})?', name)
                         or re.fullmatch(r'fr-(?:plan|section|page|small)-[0-9a-f]{16}-[0-9a-f-]+', name))
                  if raw and (raw_saved(rid) or (rid != source_id and r['conclusion'] == 'cancelled')):
                      targets.append(a)
                  elif (rid != source_id and r['run_number'] < source['run_number']
                        and not other_deploy and (name == 'foodradar-static-source' or name in crawl_reports)):
                      targets.append(a)
              elif (workflow(r) == '.github/workflows/pages.yml'
                    and r['run_number'] < pages['run_number'] and not other_deploy):
                  if re.fullmatch(r'github-pages(?:-\d+)?', name) or name in page_reports:
                      targets.append(a)

          deleted = []
          grouped = {}
          for a in targets:
              grouped.setdefault(owner(a), []).append(a)
          # 同一已完成 RUN 的逐店暫存包可能很多。每組核對一次，避免對
          # 每個檔案額外執行兩次 API 請求；不動任何研究分支或目前來源包。
          for rid, group in grouped.items():
              current = api(f'/actions/runs/{rid}')
              if current['status'] != 'completed' or current['run_attempt'] != runs[rid]['run_attempt']:
                  continue
              if api(f'/actions/runs/{pages_id}')['status'] != 'in_progress':
                  break
              for a in group:
                  try:
                      api(f"/actions/artifacts/{a['id']}", 'DELETE')
                  except HTTPError as error:
                      if error.code != 404:
                          raise
                      continue
                  deleted.append(a)
                  print('已清除', a['id'], a['name'], a['size_in_bytes'], flush=True)

          remaining = list(paginated('/actions/artifacts', 'artifacts'))
          assert not ({a['id'] for a in deleted} & {a['id'] for a in remaining}), '清理後驗證失敗'
          assert any(owner(a) == source_id and a['name'] == 'foodradar-static-source' and not a['expired']
                     for a in remaining), '最新來源包必須保留'
          assert any(owner(a) == pages_id and a['name'] == 'github-pages-' + os.environ['GITHUB_RUN_ATTEMPT']
                     and not a['expired'] for a in remaining), '最新部署包必須保留'
          total = sum(a['size_in_bytes'] for a in deleted)
          live = [a for a in remaining if not a['expired']]
          result = {'deleted_count': len(deleted), 'deleted_bytes': total,
                    'remaining_count': len(live), 'remaining_bytes': sum(a['size_in_bytes'] for a in live)}
          print('FOODRADAR_ARTIFACT_CLEANUP=' + json.dumps(result), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## 自動清理歷史 Artifact\n\n')
              f.write(f"已刪除 {len(deleted)} 個檔案，釋放 {total/1048576:.2f} MB。\n")
              f.write(f"剩餘 {len(live)} 個檔案，共 {result['remaining_bytes']/1048576:.2f} MB。\n")
          PY
