name: FoodRadar 02｜網站部署
run-name: 'FoodRadar 02｜網站部署｜執行編號 #${{ github.run_number }}'
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/live_site.cjs'
      - 'scripts/configure_web.py'
      - 'scripts/prepare_pages.py'
      - 'scripts/build_geo_index.py'
      - 'scripts/build_static_catalog.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'FoodRadar 01｜資料爬取與更新'
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: foodradar-pages-deployment
  cancel-in-progress: true
jobs:
  ingest-gate:
    name: 確認爬蟲實際成功發布資料
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      published: ${{ steps.verify.outputs.published }}
    steps:
      - name: 只允許實際完成的資料更新觸發網站部署
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          allowed = os.environ["SOURCE_CONCLUSION"] == "success" and os.environ["SOURCE_BRANCH"] == "main"
          if allowed:
              url = (f'https://api.github.com/repos/{os.environ["GH_REPOSITORY"]}'
                     f'/actions/runs/{os.environ["SOURCE_RUN_ID"]}/jobs?per_page=100')
              request = Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=25) as response:
                  jobs = json.load(response).get("jobs", [])
              allowed = any(j.get("name", "").startswith("第 16 台｜彙整驗證")
                            and j.get("conclusion") == "success"
                            and any(s.get("name") == "保存已驗證靜態資料為 Pages 來源 Artifact"
                                    and s.get("conclusion") == "success"
                                    for s in j.get("steps", [])) for j in jobs)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f'published={str(allowed).lower()}\n')
          print('VERIFIED_INGEST_DEPLOY_GATE=' + str(allowed))
          PY

  deploy:
    name: 部署最新程式與已驗證資料版本
    needs: [ingest-gate]
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.ingest-gate.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 取得最新驗證通過的爬蟲資料包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-static-source
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            echo "FOODRADAR_ARTIFACT_SOURCE_RUN=$SOURCE_RUN_ID"
            gh run download "$SOURCE_RUN_ID" --name foodradar-static-source --dir pages-static-source
          else
            # For code-only pushes, reuse the newest successfully completed crawler
            # artifact. Never download catalog data from HF or commit it to Git.
            found=0
            while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              rm -rf pages-static-source
              mkdir -p pages-static-source
              if gh run download "$run_id" --name foodradar-static-source --dir pages-static-source; then
                echo "FOODRADAR_ARTIFACT_SOURCE_RUN=$run_id"
                found=1
                break
              fi
            done < <(gh run list --workflow crawl.yml --branch main --status success --limit 25 --json databaseId --jq '.[].databaseId')
            if [[ "$found" != 1 ]]; then
              echo '找不到未過期的已驗證爬蟲 Artifact；拒絕使用舊 HF 資料或部署空資料。' >&2
              exit 1
            fi
          fi
          test -s pages-static-source/current.json
          test -d pages-static-source/blobs
      - name: 建立網站用的靜態地理查詢資料
        run: |
          pip install 'zstandard>=0.23,<1'
          python scripts/configure_web.py
          python scripts/prepare_pages.py --staging pages-static-source
      - name: 禁止舊爬蟲批次覆蓋網站最新資料
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          candidate=json.loads(Path('web/version.json').read_text(encoding='utf-8'))
          url='https://fafagoback.github.io/FoodRadar/version.json?freshness='+candidate['version']
          try:
              with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as response:
                  previous=json.load(response)
          except HTTPError as e:
              if e.code != 404:
                  raise
              previous={}
          except URLError as e:
              raise RuntimeError('Cannot check currently published batch: refuse uncertain overwrite') from e
          old=str(previous.get('batch') or '')
          current=str(candidate['batch'])
          if old and old > current:
              raise RuntimeError(f'Stale crawler artifact: published {old}, attempted {current}')
          print('FOODRADAR_LATEST_BATCH_GUARD='+json.dumps({
              'published_batch':old,'candidate_batch':current,'allowed':True
          }),flush=True)
          PY
      - name: 驗證前端程式與資料格式
        run: |
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/static-catalog.js
          node --check web/data-contract.js
          node --check tests/live_site.cjs
          node tests/web_contract.cjs
          node tests/price_history.cjs
          node tests/web_interactions.cjs
          node tests/packed_concurrency.cjs
          if grep -q 'id="archive-quote-section"' web/index.html; then
            echo '已淘汰的歷史菜單區仍存在' >&2
            exit 1
          fi
      - name: 準備網站發布設定
        uses: actions/configure-pages@v5
      - name: 上傳網站資料包
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: 發布 GitHub Pages 網站
        uses: actions/deploy-pages@v4
        id: deployment
      - name: 確認線上版本與本次資料批次一致
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import urlopen, Request
          from pathlib import Path
          expected = json.loads(Path('web/version.json').read_text(encoding='utf-8'))
          base = 'https://fafagoback.github.io/FoodRadar/'
          for attempt in range(12):
              try:
                  url = base + 'version.json?_release=' + expected['version'] + '-' + str(attempt)
                  with urlopen(Request(url, headers={'Cache-Control':'no-cache'}), timeout=20) as response:
                      manifest = json.load(response)
                  # A successful deploy must contain the exact crawler batch,
                  # not only the matching Git commit; the same code may serve
                  # many scheduled data refreshes every day.
                  if all(manifest.get(key) == expected.get(key)
                         for key in ('commit','batch','data_revision','version')):
                      print('FOODRADAR_LIVE_VERSION=' + json.dumps(manifest, ensure_ascii=False), flush=True)
                      break
              except Exception as error:
                  print('頁面版號重試', type(error).__name__, str(error)[:180], flush=True)
              if attempt == 11:
                  raise SystemExit('發布後網頁版號不符合這次部署')
              time.sleep(6)
          PY

      - name: 保存部署報告用的真實資料
        if: always()
        run: |
          mkdir -p action-reports/metrics
          if [ -s web/version.json ]; then cp web/version.json action-reports/metrics/version.json; fi
          if [ -s web/data/manifest.json ]; then cp web/data/manifest.json action-reports/metrics/manifest.json; fi
      - name: 上傳網站部署指標
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-deploy-metrics
          path: action-reports/metrics/
          if-no-files-found: warn
          retention-days: 5

  acceptance:
    name: 正式網站瀏覽器驗收
    needs: deploy
    # A skipped ingest-gate is normal on web-only pushes. GitHub's default
    # success() propagates transitive skips, so explicitly require the actual
    # deploy job to succeed and ALWAYS run browser verification afterward.
    if: ${{ always() && needs.deploy.result == 'success' }}
    # Playwright 1.56.1 does not provide Chromium for ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 安裝驗收專用瀏覽器
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 實際驗證上線網站
        run: node tests/live_site.cjs
      - name: 保存失敗診斷
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-pages-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5

  report:
    name: 產生中文網站部署與驗收總報告
    needs: [ingest-gate, deploy, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 下載本次部署指標
        if: ${{ needs.deploy.result == 'success' }} 
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: foodradar-deploy-metrics
          path: action-reports/metrics
      - name: 產生繁體中文網站部署總報告
        env:
          GATE_RESULT: ${{ needs.ingest-gate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BROWSER_RESULT: ${{ needs.acceptance.result }}
        run: python scripts/action_summary.py pages
