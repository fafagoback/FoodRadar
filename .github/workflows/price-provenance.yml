name: FoodRadar｜可疑價格來源稽核（唯讀）
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_price_provenance.py'
      - '.github/workflows/price-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 下載已發布的 HF 來源並對照商品原始價格狀態
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install 'huggingface_hub>=0.30,<2' 'zstandard>=0.23,<1'
          python scripts/inspect_price_provenance.py
