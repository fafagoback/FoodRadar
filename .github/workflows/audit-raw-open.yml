name: Inspect Costco promotion rows (read-only diagnostic)
on:
  push:
    paths: ['.github/workflows/audit-raw-open.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests msgpack zstandard
      - name: Compare live Turso Costco rows against promotion search index
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, hashlib, requests, msgpack, zstandard
          raw=os.environ["TURSO_DATABASE_URL"]
          url=raw.replace("libsql://","https://").rstrip("/")+"/v2/pipeline"
          headers={"Authorization":"Bearer "+os.environ["TURSO_READONLY_TOKEN"],"Content-Type":"application/json"}
          def sql(query):
              response=requests.post(url,headers=headers,json={"requests":[{"type":"execute","stmt":{"sql":query,"want_rows":True}},{"type":"close"}]},timeout=120)
              response.raise_for_status()
              payload=response.json()["results"][0]
              if payload.get("type")=="error": raise Exception(payload["error"])
              result=payload["response"]["result"]
              names=[c["name"] for c in result["cols"]]
              def cv(c):
                  typ=c["type"]
                  if typ=="blob": return base64.urlsafe_b64decode(c.get("base64","")+"===")
                  if typ=="null": return None
                  if typ=="integer": return int(c["value"])
                  if typ=="float": return float(c["value"])
                  return c.get("value")
              return [dict(zip(names,map(cv,r))) for r in result["rows"]]
          meta={x["key"]:json.loads(x["value"]) for x in sql("select key,value from metadata")}
          print("DB_META",json.dumps({k:meta.get(k) for k in ["latest_batch","latest_processed_at","definition_version","active_products","application","buckets"]},ensure_ascii=False))
          stores=sql("select store_id,store_uuid,name,status,is_open from store_directory where lower(name) like '%costco%' or name like '%好市多%' order by name limit 30")
          print("COSTCO_DB_STORES",json.dumps(stores,ensure_ascii=False))
          decomp=zstandard.ZstdDecompressor()
          count=int(meta.get("buckets") or 8192)
          def index_posting(term):
              n=int.from_bytes(hashlib.blake2s(term.encode(),digest_size=4).digest(),"big")%count
              rows=sql("select payload from search_buckets where bucket_id="+str(n))
              if not rows:return set()
              val=msgpack.unpackb(decomp.decompress(rows[0]["payload"]),raw=False)
              return set(val.get(term,[]))
          promo_index=index_posting("f:promo")
          brand_index=index_posting("t:cos")
          print("INDEX_COUNTS",json.dumps({"f_promo":len(promo_index),"t_cos":len(brand_index),"common":len(promo_index & brand_index)},ensure_ascii=False))
          for s in stores:
              sid=s["store_id"]
              chunks=sql("select chunk_no,payload from store_bundles where store_id="+str(sid)+" order by chunk_no")
              products=[]; cols=None
              for ch in chunks:
                  data=msgpack.unpackb(decomp.decompress(ch["payload"]),raw=False)
                  cols=data.get("product_columns") or cols
                  for gid,vals in data["products"]:
                      p=dict(zip(cols,vals))
                      if p.get("status")=="active" and int(p.get("is_open") or 0)==1 and float(p.get("price") or 0)>0:
                          promo=bool(str(p.get("promo_type") or "").strip() not in ("","無"))
                          deal=(float(p.get("discount_pct") or 0)>=30 and float(p.get("discount_amount") or 0)>0)
                          p["_promotion_only_in_frontend"]=promo or deal
                          p["_promo_index"]=gid in promo_index
                          p["_brand_index"]=gid in brand_index
                          products.append(p)
              print("STORE_SUMMARY",json.dumps({"name":s["name"],"store_id":sid,"total_active":len(products),"promo_matches":sum(int(x["_promotion_only_in_frontend"]) for x in products),"promo_index_matches":sum(int(x["_promo_index"]) for x in products),"brand_index_matches":sum(int(x["_brand_index"]) for x in products),"all_promo_type_counts":{t:sum(1 for x in products if x.get("promo_type")==t) for t in set(str(x.get("promo_type")) for x in products)}},ensure_ascii=False))
              watch=[x for x in products if any(k in str(x.get("product_name") or "").lower() for k in ["銅鑼燒","waffle","鬆餅","有機青江菜","不織布提袋","豆腐"])]
              sample=watch[:20]+[x for x in products if x["_promotion_only_in_frontend"]][:12]+products[:8]
              seen=set()
              for p in sample:
                  pid=p.get("product_uuid")
                  if pid in seen:continue
                  seen.add(pid)
                  keys=["product_uuid","product_name","category","price","effective_price","reference_price","discount_amount","discount_pct","promo_type","quantity","is_price_deal","is_open","status","_promotion_only_in_frontend","_promo_index","_brand_index"]
                  print("COSTCO_ROW",json.dumps({k:p.get(k) for k in keys},ensure_ascii=False))

          for s in stores:
              sid=s["store_id"]
              chunks=sql("select chunk_no,payload from store_bundles where store_id="+str(sid)+" order by chunk_no")
              cols=None; allp=[]
              for ch in chunks:
                  data=msgpack.unpackb(decomp.decompress(ch["payload"]),raw=False)
                  cols=data.get("product_columns") or cols
                  for _,vals in data["products"]: allp.append(dict(zip(cols,vals)))
              names=["紅豆牛乳銅鑼燒","Magic Waffles","巧克力鬆餅"]
              found=[{k:p.get(k) for k in ["product_name","price","promo_type","is_open","status","discount_pct"]} for p in allp if any(n.lower() in str(p.get("product_name") or "").lower() for n in names)]
              print("DB_EXACT_PROMO_PRODUCTS",json.dumps({"stored_total":len(allp),"matches":found},ensure_ascii=False))
              try:
                  payload={"storeUuid":s["store_uuid"],"sfNuggetCount":24}
                  headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36","Accept":"*/*","Accept-Language":"zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7","x-csrf-token":"x","Content-Type":"application/json"}
                  resp=requests.post("https://www.ubereats.com/api/getStoreV1",json=payload,headers=headers,timeout=22)
                  print("UBER_API_STATUS",resp.status_code)
                  if resp.status_code==200:
                      body=resp.json(); data=body.get("data") or {}; matches=[]; n=0; sec_names=[]
                      for groups in (data.get("catalogSectionsMap") or {}).values():
                          if not isinstance(groups,list):continue
                          for sec in groups:
                              pl=(sec.get("payload") or {}).get("standardItemsPayload") or {}
                              sec_names.append(str((pl.get("title") or {}).get("text") or ""))
                              for p in pl.get("catalogItems") or []:
                                  n+=1
                                  if any(q.lower() in str(p.get("title") or "").lower() for q in names):
                                      matches.append({"title":p.get("title"),"price":p.get("price"),"keys":list(p.keys()),"fields":{k:v for k,v in p.items() if any(kword in k.lower() for kword in ["price","promo","discount","offer"])}})
                      print("UBER_API_SUMMARY",json.dumps({"status":body.get("status"),"item_count":n,"matched_items":matches,"section_names":sec_names[:100]},ensure_ascii=False))
              except Exception as e:
                  print("UBER_API_ERROR",type(e).__name__,str(e)[:300])
          PY
