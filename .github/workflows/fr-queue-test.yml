name: FR 開發分支｜動態任務池回歸
on:
  push:
    branches: [feature/fr-dynamic-queue-20261125]
permissions:
  contents: read
jobs:
  tests:
    name: 動態任務池與既有功能回歸
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_crawl_queue.py' -v
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m py_compile src/dynamic_crawl.py src/distributed_crawl.py src/crawl_queue.py
          node --check .github/actions/fr-dynamic-crawl/main.cjs
          node --check .github/actions/fr-dynamic-crawl/artifact.cjs
