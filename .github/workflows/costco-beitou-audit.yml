name: FoodRadar 05 | Four-store independent SKU crosscheck
on:
  push:
    branches: [main]
    paths:
      - 'src/catalog_complete.py'
      - 'scripts/live_webkit_dom.py'
      - 'scripts/crosscheck_four_stores.py'
      - '.github/workflows/costco-beitou-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodradar-four-store-crosscheck
  cancel-in-progress: true
jobs:
  compare:
    name: 'A API vs B WebKit | ${{ matrix.store }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        store: [costco_beitou, pxmart_beitou_mingde, ubermart_beitou, carrefour_beitou_guangming]
    env:
      STORE_ID: ${{ matrix.store }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum API and WebKit dependencies
        run: |
          python -m pip install requests playwright
          python -m playwright install --with-deps webkit
      - name: Collect two independent methods for the same store and delivery point
        run: python scripts/crosscheck_four_stores.py
      - name: Preserve API and browser comparison, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'crosscheck-${{ matrix.store }}'
          path: 'audit-results/crosscheck-${{ matrix.store }}.json'
          retention-days: 14
          if-no-files-found: warn
