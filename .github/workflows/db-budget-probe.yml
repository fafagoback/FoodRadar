name: FoodRadar｜20MB 資料庫容量實測
run-name: 'FoodRadar｜20MB 資料庫容量實測｜#${{ github.run_number }}'
on:
  push:
    branches: [diagnostic/db-budget-20mb]
    paths: ['.github/workflows/db-budget-probe.yml', 'scripts/db_budget_probe.py', 'scripts/db_compact_candidate.py', 'src/**', 'tests/**', 'scripts/audit_canonical_history.py', 'src/compact_checkpoint.py', 'scripts/verify_compact_web.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: foodradar-db-budget-probe
  cancel-in-progress: true
jobs:
  measure:
    name: 使用第439次正式快取唯讀實測
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取得測試程式
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取第439次完整快取
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45307993586-1
          fail-on-cache-miss: true
      - name: 檢查容量並實測正規化價格紀錄
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -p test_compact_raw_replay.py -v
          python scripts/audit_canonical_history.py data/state-checkpoint/serving.db
          python -m unittest discover -s tests -v
          node tests/price_history.cjs
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'src')
          from pathlib import Path
          from state_checkpoint import compatible_contract
          metadata=json.loads(Path('data/state-checkpoint/manifest.json').read_text())
          assert compatible_contract(metadata,Path('.')), 'Previous verified cache rejected without semantic change'
          print('PREVIOUS_VERIFIED_CHECKPOINT_MIGRATION=PASS')
          PY
          python scripts/verify_compact_roundtrip.py data/state-checkpoint/serving.db
          python scripts/verify_compact_web.py data/state-checkpoint/serving.db
          node tests/web_contract.cjs
      - name: 保存容量報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-budget-report
          path: canonical-history-audit.json
          retention-days: 1
