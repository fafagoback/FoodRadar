name: FR｜15 台 DB 共用任務池（無 UE 爬蟲）
run-name: FR DB｜00派工→01-15計算→16原始保存→17單檔合併
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '既有 FR 01 爬蟲來源 Run ID（本流程不爬取）'
        required: true
        type: string
      batch_id:
        description: '來源 RAW 驗證的台灣時間14碼批次'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: fr-db-publisher
  cancel-in-progress: false
jobs:
  plan:
    name: 00｜驗證來源並建立 DB 專屬 SB 工作池
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RAW_BATCH: ${{ inputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/db_stage_plan.py --source-run-id "$SOURCE_RUN_ID" --batch-id "$RAW_BATCH"
      - uses: actions/upload-artifact@v4
        with:
          name: fr-db-plan
          path: data/db-stage-plan.json
          retention-days: 2
  workers:
    name: DB 工作機｜${{ matrix.worker }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        worker: ['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15']
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RAW_BATCH: ${{ inputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: fr-db-plan
          path: data
      - name: 空槽立即補領，逐店解碼與驗證來源
        run: python scripts/db_stage_worker.py worker --index "${{ matrix.worker }}" --source-run-id "$SOURCE_RUN_ID" --batch-id "$RAW_BATCH"
      - name: 先保存每台完整成果，再結束任務租約
        uses: actions/upload-artifact@v4
        with:
          name: db-worker-${{ github.run_id }}-${{ matrix.worker }}
          path: data/db-worker-${{ matrix.worker }}/
          retention-days: 2
      - name: 檢查 Artifact 後才逐店確認已完成
        run: python scripts/db_stage_worker.py finalize --index "${{ matrix.worker }}"
  raw:
    name: 16｜核對或串流保存 HF Raw（不重爬）
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RAW_BATCH: ${{ inputs.batch_id }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'huggingface_hub>=0.30,<2'
      - run: python scripts/db_stage_hf.py --source-run-id "$SOURCE_RUN_ID" --batch-id "$RAW_BATCH" --allow-upload
  merge:
    name: 17｜驗證15台資料，5%容錯，60天DB增量更新
    needs: [plan,workers,raw]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RAW_BATCH: ${{ inputs.batch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt 'huggingface_hub>=0.30,<2'
      - uses: actions/download-artifact@v4
        with:
          name: fr-db-plan
          path: data
      - uses: actions/download-artifact@v4
        with:
          pattern: db-worker-${{ github.run_id }}-*
          path: data/db-artifacts
          merge-multiple: false
      - name: 逐筆核對所有已完成或隔離的店家
        run: python scripts/db_stage_merge.py --source-run-id "$SOURCE_RUN_ID" --batch-id "$RAW_BATCH"
      - name: 只在 DB 全部成功後啟動 SQLite 網站再發布（仍不爬取）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sqlite-release.yml -f source_mode=rebuild
