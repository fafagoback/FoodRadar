name: FR DB 工作池｜離線單元驗證
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-pool-check.yml'
      - 'src/db_task_pool.py'
      - 'src/state_checkpoint.py'
      - 'src/compact_direct.py'
      - 'scripts/db_stage_*.py'
      - 'tests/test_db_task_pool.py'
      - 'tests/test_db_stage_integration.py'
      - 'src/relational_*.py'
      - 'scripts/build_relational_*.py'
      - 'tests/test_relational_overlay_v9.py'
      - '.github/workflows/db-distributed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: 驗證第二階段共用任務池（不爬取）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historical checkpoint assertions require pinned old commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Python 語法與任務池測試
        run: |
          python -m compileall -q src/db_task_pool.py scripts/db_stage_plan.py scripts/db_stage_worker.py scripts/db_stage_merge.py scripts/db_stage_smoke.py scripts/db_stage_hf.py tests/test_db_task_pool.py tests/test_db_stage_integration.py
          python -m unittest discover -s tests -p test_db_task_pool.py -v
          python -m unittest discover -s tests -p test_db_stage_integration.py -v
          python -m unittest discover -s tests -p test_compact_direct.py -v
          python -m unittest discover -s tests -p test_compact_incremental.py -v
          python -m unittest discover -s tests -p test_db_stage_hf.py -v
          python -m unittest discover -s tests -p test_db_stage_plan.py -v
          python -m unittest discover -s tests -p test_db_stage_source.py -v
          python -m unittest discover -s tests -p test_db_checkpoint_reshard_migration.py -v
          python -m unittest discover -s tests -p test_incremental_checkpoint.py -v
          PYTHONPATH=src python -c 'from state_checkpoint import direct_contract_digest; print("FOODRADAR_CURRENT_DIRECT_DIGEST="+direct_contract_digest())'

          python -m unittest discover -s tests -p test_relational_overlay_v9.py -v
          python -m py_compile src/relational_overlay_v9.py scripts/build_relational_overlay_v9.py scripts/publish_relational_overlay_v9.py
          node --input-type=module --check < web/relational-v9-preview.js
