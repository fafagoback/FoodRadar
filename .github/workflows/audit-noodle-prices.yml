name: Audit noodle pricing read only
on:
  push:
    branches: [audit-noodle-price-20261021]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare read-only audit dependencies
        run: python -m pip install --quiet zstandard msgpack huggingface_hub
      - name: Inspect store events and archived original prices
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/list_turso_schema_readonly.py
