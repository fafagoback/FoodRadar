name: 臨時清除 Actions 執行紀錄
run-name: 臨時清除 Actions 執行紀錄
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-purge-actions.yml'
permissions:
  actions: write
  contents: read
jobs:
  purge:
    name: 清除全部歷史執行紀錄
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 等待臨時清除工作流程移除，然後清空所有執行紀錄
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request, urllib.error
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          me = int(os.environ['SELF_RUN_ID'])
          api = f'https://api.github.com/repos/{repo}'
          def request(method, path):
              r = urllib.request.Request(api+path, method=method, headers={
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'foodradar-actions-one-time-cleaner'})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(r, timeout=30) as resp:
                          data = resp.read()
                          return resp.status, json.loads(data) if data else {}
                  except urllib.error.HTTPError as e:
                      if e.code == 404: return 404, {}
                      details = e.read().decode(errors='replace')[:300]
                      if e.code in (429, 500, 502, 503) or (e.code == 403 and 'rate limit' in details.lower()):
                          time.sleep(min(5*(attempt+1),25))
                          continue
                      print(f'HTTP {e.code}: {method} {path}: {details}', flush=True)
                      return e.code, {}
              return 599, {}
          # The temporary YAML is removed by the repository manager once this run starts.
          for _ in range(90):
              s,_ = request('GET','/contents/.github/workflows/temporary-purge-actions.yml?ref=main')
              if s == 404: break
              time.sleep(3)
          else:
              print('臨時工作流程仍在 repo；不開始大量刪除，避免留下難以追蹤的工作流程。',flush=True)
              raise SystemExit(1)
          print('已確認臨時工作流程移除，開始清理紀錄。',flush=True)
          # Allow CI triggered by the removal commit to settle.
          time.sleep(45)
          deleted=0
          for cycle in range(18):
              s, data = request('GET','/actions/runs?per_page=100&page=1')
              if s != 200:
                  raise SystemExit(f'無法列出執行紀錄: {s}')
              runs = [r for r in data.get('workflow_runs',[]) if int(r['id'])!=me]
              if not runs:
                  print(f'已清除 {deleted} 筆；只剩本次清理工作。', flush=True)
                  break
              n=0
              for r in runs:
                  rid=int(r['id'])
                  if r.get('status')!='completed':
                      request('POST',f'/actions/runs/{rid}/cancel')
                      continue
                  s,_=request('DELETE',f'/actions/runs/{rid}')
                  if s==204 or s==404: deleted+=1; n+=1
                  if deleted % 25 == 0 and n: print(f'已刪除 {deleted} 筆',flush=True)
                  time.sleep(.14)
              if n==0: time.sleep(18)
              else: time.sleep(2)
          print(f'總共清除 {deleted} 筆，嘗試移除本次清除工作本身。', flush=True)
          status,_=request('DELETE',f'/actions/runs/{me}')
          print(f'自身執行紀錄刪除回應：{status}',flush=True)
          PY
