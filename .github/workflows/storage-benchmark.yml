name: FoodRadar｜第十四輪原生欄式資料庫實驗
run-name: FoodRadar｜DuckDB 原生資料模型與交易實測
on:
  push:
    branches: [research/storage-20261124]
    paths:
      - '.github/workflows/storage-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foodradar-storage-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.ref == 'refs/heads/research/storage-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝開源套件
        run: pip install 'msgpack>=1,<2' 'zstandard>=0.23,<1' 'duckdb>=1.4,<2' 'pyarrow>=18,<25' 'pandas>=2,<3'
      - name: 唯讀還原固定正式資料
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45353673604-1
          fail-on-cache-miss: true
      - name: 原生欄式儲存及逐筆一致性、獨立記憶體、單店交易實測
        run: |
          set -o pipefail
          python scripts/benchmark_storage_round14_duckdb.py data/state-checkpoint | tee /tmp/fr14.log
          grep -q '^FR14_RESULT=' /tmp/fr14.log
      - name: 保存本輪研究結果
        if: always()
        run: |
          mkdir -p docs/storage-research
          report=docs/storage-research/round14-${{ github.run_id }}.log
          if test -f /tmp/fr14.log; then cp /tmp/fr14.log "$report"; else echo '無實測結果，請檢查 Actions 日誌' > "$report"; fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m '保存第十四輪原生欄式實測紀錄'
          git push origin HEAD:research/storage-20261124
