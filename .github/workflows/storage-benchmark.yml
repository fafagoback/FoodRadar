name: FoodRadar｜第十輪自動結構搜尋
run-name: FoodRadar｜整數差值與欄位基準編碼實測
on:
  push:
    branches: [research/storage-20261124]
    paths:
      - '.github/workflows/storage-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: foodradar-storage-benchmark
  cancel-in-progress: false
jobs:
  search:
    if: github.ref == 'refs/heads/research/storage-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/storage-20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查研究截止時間
        id: deadline
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-25 00:00:00' +%s)" ]; then echo 'active=true' >> "$GITHUB_OUTPUT"; fi
      - name: 安裝免費開源套件
        if: steps.deadline.outputs.active == 'true'
        run: pip install 'msgpack>=1,<2' 'zstandard>=0.23,<1'
      - name: 還原固定正式資料版本
        if: steps.deadline.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45353673604-1
          fail-on-cache-miss: true
      - name: 逐輪驗證並記錄不同候選方案
        if: steps.deadline.outputs.active == 'true'
        id: bench
        run: |
          set -o pipefail
          mkdir -p docs/storage-research
          python scripts/benchmark_storage_round10.py data/state-checkpoint | tee /tmp/fr10.log
          grep -q '^FR10_RESULT=' /tmp/fr10.log
      - name: 保存本輪研究紀錄
        if: always() && steps.deadline.outputs.active == 'true'
        run: |
          mkdir -p docs/storage-research
          if test -f /tmp/fr10.log; then cp /tmp/fr10.log docs/storage-research/round10-${{ github.run_id }}.log; else echo '未取得測試日誌' > docs/storage-research/round10-${{ github.run_id }}.log; fi
          tail -c 50000 docs/storage-research/round10-${{ github.run_id }}.log >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/storage-research
          git commit -m '保存第十輪結構搜尋進度'
          git push origin HEAD:research/storage-20261124
