name: FoodRadar｜一次性實際資料庫容量實驗
run-name: FoodRadar｜完整無損儲存最佳化實驗
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodradar-storage-benchmark
  cancel-in-progress: true
jobs:
  benchmark:
    name: 唯讀還原正式資料並比較容量及效能
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝測試必要套件
        run: pip install 'msgpack>=1,<2' 'zstandard>=0.23,<1'
      - name: 唯讀還原既有正式資料庫快取
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-storage-experiment-${{ github.run_id }}
          restore-keys: |
            foodradar-state-v1-
          fail-on-cache-miss: true
      - name: 逐筆比對及壓縮效能實驗
        run: |
          set -o pipefail
          python scripts/benchmark_storage_search.py data/state-checkpoint | tee /tmp/fr-benchmark.log
      - name: 彙整實驗結果
        if: always()
        run: |
          echo '## 真實資料容量與效能實驗（不部署、不更新快取）' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/fr-benchmark.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/fr-benchmark.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
