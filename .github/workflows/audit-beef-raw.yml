name: FoodRadar｜原始 HTTP 價格證據查核（唯讀）
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_beef_raw_http.py'
      - '.github/workflows/audit-beef-raw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證 HF Raw HTTP 封存內容與 Uber Eats 原始價格
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install 'huggingface_hub>=0.30,<2'
          python scripts/audit_beef_raw_http.py
