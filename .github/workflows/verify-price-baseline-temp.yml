name: Verify first verified price history
on:
  push:
    branches: [fix-baseline-price-history-20261021]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Backend and frontend regressions
        run: |
          python -m unittest discover -s tests -v
          node --check web/packed-turso.js
          node --check web/app.js
          node tests/price_history.cjs
          node tests/web_contract.cjs
