name: FoodRadar 01｜品質測試
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodradar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Python、JavaScript 與 Actions 設定驗證
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Python 全套回歸測試
        run: python -m unittest discover -s tests -v
      - name: 網站資料契約與 JavaScript 測試
        run: |
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/data-contract.js
          node --check tests/live_site.cjs
          node tests/web_contract.cjs
          node tests/price_history.cjs
          node tests/web_interactions.cjs
          node tests/packed_concurrency.cjs
      - name: 驗證三個 Workflow 的 GitHub Actions 語法
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@latest -color=false .github/workflows/*.yml
          python - <<'PY'
          from pathlib import Path
          expected={'ci.yml','crawl.yml','pages.yml'}
          actual={p.name for p in Path('.github/workflows').glob('*.yml')}
          assert actual==expected, f'Workflow 清單不符：{actual}'
          PY
  one-time-turso-purge:
    name: 一次性清空正式 FoodRadar Turso
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'One-time FoodRadar Turso data purge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.32,<3'
      - name: 刪除所有 FoodRadar 正式資料列並查驗歸零
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.FOODRADAR_TURSO_WRITE_TOKEN }}
        run: |
          python - <<'PY'
          import json, re
          from scripts.publish_turso_delta import Remote
          remote = Remote(__import__('os').environ['TURSO_DATABASE_URL'], __import__('os').environ['TURSO_AUTH_TOKEN'])
          try:
              tables = [r['name'] for r in remote.query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
              if 'metadata' not in tables:
                  raise RuntimeError('Refusing purge: FoodRadar ownership marker table missing')
              identity = {r['key']:r['value'] for r in remote.query('SELECT key,value FROM metadata')}
              if json.loads(identity.get('application', 'null')) != 'FoodRadar':
                  raise RuntimeError('Refusing purge: wrong database application marker')
              if not tables or any(re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*', t) is None for t in tables):
                  raise RuntimeError('Refusing purge: unexpected table identifiers')
              print('TARGET_APP=FoodRadar TABLES=' + json.dumps(tables,ensure_ascii=False),flush=True)
              remote.query('BEGIN IMMEDIATE')
              try:
                  before = {t:remote.query(f'SELECT COUNT(*) AS n FROM "{t}"')[0]['n'] for t in tables}
                  for table in tables:
                      remote.query(f'DELETE FROM "{table}"')
                  remaining = {t:remote.query(f'SELECT COUNT(*) AS n FROM "{t}"')[0]['n'] for t in tables}
                  if any(remaining.values()):
                      raise RuntimeError('Not all FoodRadar Turso data was deleted')
                  remote.query('COMMIT')
                  after = {t:remote.query(f'SELECT COUNT(*) AS n FROM "{t}"')[0]['n'] for t in tables}
                  if any(after.values()):
                      raise RuntimeError('Post-commit verification failed')
                  print('FOODRADAR_TURSO_PURGE_VERIFIED=' + json.dumps({'before':before,'after':after,'schema_preserved':True},ensure_ascii=False),flush=True)
              except BaseException:
                  try: remote.query('ROLLBACK')
                  except Exception: pass
                  raise
          finally:
              remote.close()
          PY
