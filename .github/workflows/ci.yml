name: FoodRadar 01｜品質測試
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foodradar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Python、JavaScript 與 Actions 設定驗證
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 實際 Costco Raw 全商品驗證（本次專用）
        run: |
          python - <<'PY'
          import json, tarfile,sys,collections
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          sys.path.insert(0,'src')
          from menu_core import convert_api_data_to_schema
          from verified_prices import reconcile_duplicate_skus, quote_from_converted_item
          repo='hub-google/FoodRadar'
          manifest=json.loads(Path(hf_hub_download(repo_id=repo,filename='Raw/latest.json',repo_type='dataset')).read_text())
          store=next(s for s in manifest['stores'] if 'costco' in s['store_url'].lower())
          archive=hf_hub_download(repo_id=repo,filename=manifest['archive_path'],repo_type='dataset')
          with tarfile.open(archive,'r:gz') as opened:
              envelope=json.load(opened.extractfile(store['response_path']))
          doc=convert_api_data_to_schema(envelope['data'],store['store_url'])
          reconcile_duplicate_skus(doc)
          found={}
          for section in doc['hasMenu']['hasMenuSection']:
              for item in section.get('hasMenuItem') or []:
                  found.setdefault(str(item.get('identifier')),item)
          counters=collections.Counter()
          omitted=[]
          for key,item in found.items():
              q=quote_from_converted_item(item)
              if q:counters['VERIFIED']+=1
              else:
                  reason=(item.get('verified_price') or {}).get('reason') or 'UNKNOWN'
                  counters[reason]+=1
                  omitted.append([item.get('name'),reason])
          print('COSTCO_AFTER_FIX='+json.dumps({'batch':manifest['batch_id'],'raw_unique':len(found),
              'counters':counters,'still_unverified':omitted},ensure_ascii=False),flush=True)
          assert len(found)==63 and counters['VERIFIED']==63, 'Costco raw products still dropped by price validation'
          PY
      - name: Python 全套回歸測試
        run: python -m unittest discover -s tests -v
      - name: 網站資料契約與 JavaScript 測試
        run: |
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/data-contract.js
          node --check tests/live_site.cjs
          node tests/web_contract.cjs
          node tests/price_history.cjs
          node tests/web_interactions.cjs
          node tests/packed_concurrency.cjs
      - name: 驗證三個 Workflow 的 GitHub Actions 語法
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@latest -color=false .github/workflows/*.yml
          python - <<'PY'
          from pathlib import Path
          expected={'ci.yml','crawl.yml','pages.yml'}
          actual={p.name for p in Path('.github/workflows').glob('*.yml')}
          assert actual==expected, f'Workflow 清單不符：{actual}'
          PY
