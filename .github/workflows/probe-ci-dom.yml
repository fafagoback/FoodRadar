name: FoodRadar DOM storefront runner feasibility
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_ci_storefront.py
      - .github/workflows/probe-ci-dom.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - run: python scripts/probe_ci_storefront.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-probe-${{ matrix.os }}
          path: audit-browser-probe
          retention-days: 3
