name: FoodRadar｜直接讀寫精簡資料庫驗收
on:
  push:
    branches: [diagnostic/direct-compact]
permissions:
  contents: read
  actions: read
concurrency:
  group: foodradar-direct-compact-probe
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取已驗收的正式精簡資料庫
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45337750740-1
          fail-on-cache-miss: true
      - name: 讀取已成功產出的網站資料清單
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45337750740 --name foodradar-static-source --dir reference-static
      - name: 完整回歸與增量功能等價測試
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/price_history.cjs
      - name: 直接讀取18MB資料庫產出原網站並逐一比對雜湊
        run: python scripts/verify_direct_compact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-compact-report
          path: direct-compact-report.json
          retention-days: 1
