name: FoodRadar｜直接讀寫精簡資料庫驗收
on:
  push:
    branches: [diagnostic/direct-compact]
permissions:
  contents: read
  actions: read
concurrency:
  group: foodradar-direct-compact-probe
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取已驗收的正式精簡資料庫
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45337750740-1
          fail-on-cache-miss: true
      - name: 讀取本次真實新爬取批次的舊引擎基準
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45338816255 --name foodradar-static-source --dir reference-static
      - name: 安裝執行環境與回歸測試
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/price_history.cjs
      - name: 從舊快取直接更新本次真實新爬取資料
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/prepare_hf_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          batch=Path("data/latest.txt").read_text().strip()
          r=json.loads((Path("data")/batch/"direct-db-report.json").read_text())
          m=json.loads(Path("data/state-checkpoint/manifest.json").read_text())
          old=json.loads(Path("reference-static/current.json").read_text())
          new=json.loads((Path("data")/batch/"static-public/current.json").read_text())
          assert batch=="20261124142003",batch
          assert m["format"]=="foodradar-checkpoint-v4"
          assert r["full_expanded_database_bytes"]==0
          assert r["compact_bytes"]<20_000_000
          assert r["max_shop_scratch_bytes"]>0
          for field in ("batch","files","summary","counts","data_revision"):
              assert old[field]==new[field],field
          print("DIRECT_REAL_NEW_BATCH_PARITY="+json.dumps(r),flush=True)
          Path("direct-compact-report.json").write_text(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: 重新直接讀取新快取並確認所有資料一致
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/prepare_hf_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          batch=Path("data/latest.txt").read_text().strip()
          r=json.loads((Path("data")/batch/"direct-db-report.json").read_text())
          old=json.loads(Path("reference-static/current.json").read_text())
          new=json.loads((Path("data")/batch/"static-public/current.json").read_text())
          assert r["full_expanded_database_bytes"]==0
          assert r["max_shop_scratch_bytes"]==0
          assert r["compact_bytes"]<20_000_000
          for field in ("batch","files","summary","counts","data_revision"):
              assert old[field]==new[field],field
          print("DIRECT_V4_CACHE_REUSE_PARITY="+json.dumps(r),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-compact-report
          path: direct-compact-report.json
          retention-days: 1
