name: Tender｜獨立 HF 只讀封存（不刪除 Supabase）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tender-hf-archive-bridge.yml'
permissions:
  contents: read
concurrency:
  group: tender-hf-archive-one-at-a-time
  cancel-in-progress: false
jobs:
  archive:
    name: 驗證標案來源筆數、封存 HF、逐檔讀回 SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: 讀取標案平台的獨立封存程式
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: ef08add5e8520894dadcbd60e7228852975340a5
          path: OpenData
          persist-credentials: false
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝 HF 與 HTTP 工具
        run: python -m pip install 'requests>=2.32,<3' 'huggingface_hub>=0.30,<2'
      - name: 封存公開來源資料至私人 HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: hub-google/TenderIntelligence
          SUPABASE_URL: https://unapiwajmgqqtdkixaab.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_L09XC4Tekm6cZaPTTczm3g_Aap-SOSy
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is missing. No data has been deleted."
            exit 1
          fi
          python OpenData/tender-intelligence-web/scripts/archive_public_to_hf.py
