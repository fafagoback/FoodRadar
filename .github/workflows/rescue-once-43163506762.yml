name: FoodRadar 04｜單次補救 2026-11-12 已保存的 15 台原始資料
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rescue-once-43163506762.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: foodradar-database-publisher
  cancel-in-progress: false
jobs:
  recover_once:
    name: 用已抓取的 Raw 資料補救並入庫（不重新啟動 15 台）
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'run(rescue-raw-43163506762):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 驗證指定正式抓取的 15 台均成功保存 Raw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="/repos/$GITHUB_REPOSITORY/actions/runs/43163506762/jobs?per_page=100"
          total=$(gh api "$API" --jq '[.jobs[] | select(.name | startswith("抓取工作機"))] | length')
          good=$(gh api "$API" --jq '[.jobs[] | select(.name | startswith("抓取工作機")) | select(.conclusion == "success")] | length')
          printf 'FOODRADAR_RESCUE_SOURCE_SHARDS total=%s successful=%s\n' "$total" "$good"
          test "$total" -eq 15 && test "$good" -eq 15
      - name: 下載 15 台原始商品資料（不再做 15 台重爬）
        uses: actions/download-artifact@v4
        with:
          run-id: 43163506762
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: foodradar-raw-shard-*
          path: data/parts
          merge-multiple: false
      - name: 確認 15 份工作機原始資料齊全
        run: |
          count=$(find data/parts -maxdepth 1 -name 'foodradar-raw-shard-*' -type d | wc -l)
          echo "FOODRADAR_RESCUE_ARTIFACT_SHARDS=$count"
          test "$count" -eq 15
          python -m unittest discover -s tests -v
      - name: 從已存 Feed 補抓漏分店家，交叉驗證並寫入 HF Raw
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/distributed_crawl.py merge --count 15 --input-dir data/parts --repair-missing --upload
      - name: 從 HF 不可變原始資料建立候選資料庫
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/prepare_hf_release.py
      - name: 檢查來源、商品價格與歷史優惠
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          batch=Path("data/latest.txt").read_text().strip()
          con=sqlite3.connect(f"data/{batch}/serving.db")
          assert con.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          types=dict(con.execute(
              "SELECT promotion_type,COUNT(*) FROM product_price_observations GROUP BY promotion_type"
          ))
          assert types.get("NONE",0)>0
          assert types.get("SAME_SKU_BXGY",0)>0
          assert types.get("DIRECT_DISCOUNT",0)>0
          assert set(types)<= {"NONE","SAME_SKU_BXGY","DIRECT_DISCOUNT"}
          print("FOODRADAR_RESCUE_PRICE_TYPES="+json.dumps(types,ensure_ascii=False))
          con.close()
          PY
          BATCH=$(cat data/latest.txt)
          python scripts/audit_deal_pipeline.py "data/$BATCH/serving.db"
      - name: 驗證候選庫，將差異正式寫入 Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.FOODRADAR_TURSO_WRITE_TOKEN }}
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/verify_packed_local.py "data/$BATCH/packed-serving.db" --report packed-report.json
          python scripts/publish_turso_delta.py "data/$BATCH/packed-serving.db" --apply --report delta-report.json
      - name: 用唯讀憑證驗證 Turso 已入庫的資料
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/audit_live_turso.py
      - name: 保存本次上傳及入庫數據
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-raw-rescue-43163506762-evidence
          path: |
            data/**/shard-reconciliation.json
            data/**/store-identity-report.json
            packed-report.json
            delta-report.json
          retention-days: 14
          if-no-files-found: ignore
