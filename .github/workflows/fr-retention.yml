name: FoodRadar 03｜60天 HF 與 GitHub 儲存清理
run-name: 'FoodRadar 03｜儲存空間清理｜執行編號 #${{ github.run_number }}'
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fr-retention.yml','scripts/prune_legacy_fr_workflows.py']
  workflow_call:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只盤點，不刪除資料包'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  # Do not rewrite HF history while Pages/SQLite serves a pending release.
  group: foodradar-pages-deployment
  cancel-in-progress: false
jobs:
  cleanup:
    name: 盤點並清理已無用途的歷史資料包
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      # One-time, message-gated removal of the 67 pre-existing historical Action runs.
      - name: 一次性刪除使用者指定的 67 筆舊執行紀錄
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'PURGE_FR_67_RUNS') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(46075780883 46075467679 46074998791 46074947416 46023983182 46009108499 45951424825 45951298296 45950995702 45950712111 45950631874 45950498413 45949021711 45948919900 45940962364 45939507529 45919121529 45918804678 45918759574 45886614634 45885831733 45754718356 45753910932 45731424907 45730602466 45730018343 45729863455 45691922520 45690690500 45562363812 45561359130 45560714688 45560088980 45559868669 45558320085 45556797717 45555645238 45555305489 45555138885 45555043464 45554500390 45553811846 45538593357 45538230458 45536586023 45536230104 45535606107 45535344539 45535176902 45532368301 45530843804 45528683174 45525937596 45523009252 45521049885 45519459639 45485087459 45483887975 45441190320 45439189768 45437153828 45436994369 45436163012 45434134244 45362564847 45361219784 45355401639)
          [[ "${#ids[@]}" -eq 67 ]] || exit 1
          removed=0
          for id in "${ids[@]}"; do
            [[ "$id" != "$GITHUB_RUN_ID" ]] || { echo "Refusing to delete current job"; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null
            removed=$((removed+1))
            echo "FR_HISTORY_RUN_DELETED=$id"
          done
          echo "FR_HISTORY_RUNS_PURGED=$removed" >> "$GITHUB_STEP_SUMMARY"
      - name: 安裝 HF 清理所需套件
        run: python3 -m pip install -r requirements.txt 'huggingface_hub>=0.30,<2'
      - name: 驗證 60 天 Raw 與歷史提交清理
        run: |
          python3 -m unittest discover -s tests -p 'test_hf_retention.py' -v
          python3 -m unittest discover -s tests -p 'test_cleanup_sqlite_previews.py' -v
      - name: 只清理已從 main 移除、完全停止的舊版 Workflows 與其執行紀錄
        if: ${{ success() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_legacy_fr_workflows.py

      - name: 清理歷史 Artifact 並產生中文報告
        env:
          GH_TOKEN: ${{ github.token }}
          FR_CLEANUP_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 -u scripts/cleanup_artifacts.py

      - name: 刪除 HF 未被 current/preview 指標引用的舊 SQLite 版本
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FR_CLEANUP_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [[ "$FR_CLEANUP_DRY_RUN" == true ]]; then
            python3 scripts/cleanup_sqlite_previews.py
          else
            python3 scripts/cleanup_sqlite_previews.py --apply
          fi

      - name: HF Raw 僅保留 60 天，清除歷史提交及舊檔案版本
        if: ${{ success() }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FR_CLEANUP_DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          if [[ "$FR_CLEANUP_DRY_RUN" == true ]]; then
            python3 src/hf_retention.py cleanup --dry-run
          else
            python3 src/hf_retention.py cleanup
          fi
