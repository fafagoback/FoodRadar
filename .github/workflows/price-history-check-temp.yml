name: FoodRadar price-history predeployment tests
on:
  push:
    branches: [fix-price-history-display-20261021]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check web/packed-turso.js
          node --check web/app.js
          node tests/web_contract.cjs
          node tests/price_history.cjs
