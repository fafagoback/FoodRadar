name: FR 開發分支｜爬蟲本機測試
on:
  push:
    branches: [feature/adaptive-crawl-20261124]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-crawl.txt
      - run: python -m compileall -q src scripts
      - run: |
          python -m unittest discover -s tests -p 'test_adaptive_threads.py' -v
          python -m unittest discover -s tests -p 'test_crawl_batches.py' -v
          python -m unittest discover -s tests -p 'test_crawl_transport.py' -v
          python -m unittest discover -s tests -p 'test_adaptive_pacing.py' -v
          python -m unittest discover -s tests -p 'test_retry_after.py' -v
          python -m unittest discover -s tests -p 'test_catalog_429_backoff.py' -v
          python -m unittest discover -s tests -p 'test_distributed_crawl.py' -v
          python -m unittest discover -s tests -p 'test_immutable_raw_capture.py' -v
