name: FoodRadar 03｜儲存空間清理
run-name: 'FoodRadar 03｜儲存空間清理｜執行編號 #${{ github.run_number }}'
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只盤點，不刪除資料包'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: foodradar-artifact-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    name: 盤點並清理已無用途的歷史資料包
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 清理歷史 Artifact 並產生中文報告
        env:
          GH_TOKEN: ${{ github.token }}
          FR_CLEANUP_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 -u scripts/cleanup_artifacts.py
  retire-old-workflows:
    name: 一次性移除舊開發流程紀錄
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'FR_RETIRE_LEGACY_RUNS') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 僅刪除已完成的指定舊 Workflow RUN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for entry in '428808558:.github/workflows/adaptive-branch-test.yml' '429745485:.github/workflows/fr-completion-test.yml' '429729286:.github/workflows/fr-final-test.yml' '429311960:.github/workflows/fr-queue-test.yml'; do
            wid="${entry%%:*}"
            path="${entry#*:}"
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/runs?per_page=100" --jq ".workflow_runs[] | [.id,.status,.path,.workflow_id] | @tsv")
            while IFS=$'\t' read -r id status actual actual_wid; do
              [[ -n "$id" ]] || continue
              [[ "$actual" == "$path" && "$actual_wid" == "$wid" && "$status" == completed ]] || { echo "Unexpected or active run $id; skipped"; continue; }
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent
              echo "已刪除舊 RUN $id ($path)"
            done <<< "$runs"
            remaining=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wid/runs?per_page=1" --jq '.total_count')
            echo "$path remaining=$remaining" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$remaining" == 0 ]]
          done
