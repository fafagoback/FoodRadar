name: 緊急停止全部 Actions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/emergency-stop.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: repository-emergency-stop
  cancel-in-progress: false
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 停用所有原有 Workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" --jq '.workflows[] | select(.state=="active" and .path!=".github/workflows/emergency-stop.yml") | .id' | while read -r id; do
            echo "Disable workflow ID $id"
            gh api -X PUT "repos/$REPO/actions/workflows/$id/disable"
          done
      - name: 取消全部正在執行及排隊的 Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWN_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4 5 6 7 8; do
            ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="requested" or .status=="pending") | .id')
            found=0
            while read -r id; do
              [[ -z "$id" || "$id" == "$OWN_RUN" ]] && continue
              found=1
              echo "Cancel Run $id"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" || true
            done <<< "$ids"
            [[ $found -eq 0 ]] && break
            sleep 5
          done
      - name: 停用緊急流程自身，並取消本次 Run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWN_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          gh api -X PUT "repos/$REPO/actions/workflows/emergency-stop.yml/disable"
          gh api -X POST "repos/$REPO/actions/runs/$OWN_RUN/cancel" || gh api -X POST "repos/$REPO/actions/runs/$OWN_RUN/force-cancel"
