name: FoodRadar 04 | Daily Dual Audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_triple_audit.py'
      - 'scripts/audit_full_catalog.py'
      - '.github/workflows/daily-dual-audit.yml'
  schedule:
    # 04:00 Asia/Taipei = previous day 20:00 UTC, before 06:30 main crawl
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foodradar-daily-triple-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install two independent observation engines
        run: |
          python -m pip install requests playwright huggingface_hub zstandard msgpack curl_cffi beautifulsoup4
          python -m playwright install --with-deps webkit
      - name: Remove prior audit evidence before checking new batch
        run: rm -f audit-results/full-catalog-latest.json
      - name: Independently reconcile all captured stores and products through HF Raw and Turso
        id: full
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/audit_full_catalog.py
      - name: Compare API products with actual WebKit-rendered storefront cards
        id: audit
        continue-on-error: true
        env:
          DOM_CATEGORY_LIMIT: '0'
          DOM_SCROLL_STEPS: '8'
          # An authorized remote Chrome session can supply a non-datacenter
          # network and existing browser session to the independent DOM audit.
          # Keep the full CDP URL (including provider token) in GitHub Secrets.
          FOODRADAR_DOM_CDP_URL: ${{ secrets.FOODRADAR_DOM_CDP_URL }}
        run: python scripts/daily_triple_audit.py
      - name: Preserve report in GitHub for QueueMonster LINE notifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s audit-results/latest.json ]; then
            mkdir -p audit-results
            python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          now=datetime.now(timezone(timedelta(hours=8)))
          Path('audit-results/latest.json').write_text(json.dumps({
            "date":now.strftime('%Y-%m-%d'),"generated_at":now.isoformat(),
            "fatal_error":"The two-method audit failed before writing a report",
            "stores":[]},ensure_ascii=False,indent=2))
          PY
          fi
          # Keep evidence in a temporary backup before moving the ephemeral
          # runner to origin/main. Other jobs may have committed meanwhile.
          DAY=$(TZ=Asia/Taipei date +%F)
          BACKUP=$(mktemp -d)
          cp audit-results/latest.json "$BACKUP/latest.json"
          if [ -s audit-results/full-catalog-latest.json ]; then
            cp audit-results/full-catalog-latest.json "$BACKUP/full.json"
          fi
          git config user.name "foodradar-audit-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SAVED=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            mkdir -p "audit-results/$DAY"
            cp "$BACKUP/latest.json" audit-results/latest.json
            cp "$BACKUP/latest.json" "audit-results/$DAY/report.json"
            if [ -s "$BACKUP/full.json" ]; then
              cp "$BACKUP/full.json" audit-results/full-catalog-latest.json
              cp "$BACKUP/full.json" "audit-results/$DAY/full-catalog-report.json"
            else
              rm -f audit-results/full-catalog-latest.json
            fi
            git add audit-results/latest.json "audit-results/$DAY/report.json"
            if [ -s "$BACKUP/full.json" ]; then
              git add audit-results/full-catalog-latest.json "audit-results/$DAY/full-catalog-report.json"
            else
              git ls-files --error-unmatch audit-results/full-catalog-latest.json >/dev/null 2>&1 &&
                git rm -f audit-results/full-catalog-latest.json || true
            fi
            if git diff --cached --quiet; then
              SAVED=1
              break
            fi
            git commit -m "audit: daily two-method observation results [skip ci]"
            if git push origin HEAD:main; then
              SAVED=1
              break
            fi
            echo "Concurrent Git update; retrying audit evidence submission ($ATTEMPT/5)"
            sleep $((ATTEMPT * 2))
          done
          if [ "$SAVED" -ne 1 ]; then
            echo "Failed to preserve latest report after five safe retries"
            exit 1
          fi
      - name: Upload two-method audit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-dual-audit
          path: |
            audit-results/latest.json
            audit-results/full-catalog-latest.json
            audit-results/*/report.json
            audit-results/*/*/result.json
            audit-results/*/*/*.body
            audit-results/*/*/catalog/**/*.body
          retention-days: 5
          if-no-files-found: ignore
      - name: Mark audit failure without suppressing report
        if: steps.audit.outcome != 'success' || steps.full.outcome != 'success'
        run: |
          echo "Daily audit NOT VERIFIED: API/browser or full native Raw->ETL->Turso check failed."
          exit 1
