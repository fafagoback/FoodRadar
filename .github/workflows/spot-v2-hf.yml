name: Check real HF V2 native price pairings (read-only)
on:
  push:
    branches: [fix/v2-native-price-only-20261030]
permissions:
  contents: read
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[spot-hf-raw]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'huggingface_hub>=0.25,<1'
      - name: Test actual latest HF archive's raw pairing and native values
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/spot_v2_hf.py
