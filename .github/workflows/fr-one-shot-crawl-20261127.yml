name: FR｜一次性爬蟲與整套發布實測
run-name: FR 單次測試｜15台爬取→16存Raw→15台DB→17合併→SQLite網站
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fr-one-shot-crawl-20261127.yml'
permissions:
  actions: write
  contents: read
concurrency:
  group: fr-one-shot-20261127
  cancel-in-progress: false
jobs:
  run-once:
    name: 只啟動一次 FR 單點；原自動排程保持關閉
    if: ${{ contains(github.event.head_commit.message, 'FR_ONCE_CRAWL_20261127') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 只啟動單次 FR crawl；工作結束恢復禁用狀態
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          original_crawl=$(gh api "$api/workflows/crawl.yml" --jq .state)
          original_db=$(gh api "$api/workflows/db-distributed.yml" --jq .state)
          echo "FR_CRAWL_INITIAL_WORKFLOW_STATE=$original_crawl"
          echo "FR_DB_INITIAL_WORKFLOW_STATE=$original_db"
          restore() {
            if [[ "$original_crawl" != "active" ]]; then
              gh api -X PUT "$api/workflows/crawl.yml/disable" || true
            fi
            if [[ "$original_db" != "active" ]]; then
              gh api -X PUT "$api/workflows/db-distributed.yml/disable" || true
            fi
          }
          trap restore EXIT
          if [[ "$original_crawl" != active ]]; then
            gh api -X PUT "$api/workflows/crawl.yml/enable"
          fi
          if [[ "$original_db" != active ]]; then
            gh api -X PUT "$api/workflows/db-distributed.yml/enable"
          fi
          sleep 3
          existing=$(gh api "$api/workflows/crawl.yml/runs?per_page=100" --jq \
            "[.workflow_runs[] | select(.event==\"workflow_dispatch\" and .head_sha==\"$GITHUB_SHA\")] | sort_by(.id) | last | .id // empty")
          if [[ -n "$existing" ]]; then
            crawl_id="$existing"
            echo "FR_CRAWL_REUSING_EXISTING_RUN=$crawl_id"
          else
            gh workflow run crawl.yml --ref main -f mode=crawl -f discovery_scope=single
            crawl_id=""
            for attempt in {1..40}; do
              crawl_id=$(gh api "$api/workflows/crawl.yml/runs?per_page=100" --jq \
                "[.workflow_runs[] | select(.event==\"workflow_dispatch\" and .head_sha==\"$GITHUB_SHA\")] | sort_by(.id) | last | .id // empty")
              [[ -n "$crawl_id" ]] && break
              sleep 3
            done
            [[ -n "$crawl_id" ]] || { echo 'Dispatch was accepted but crawler run was not indexed' >&2; exit 1; }
          fi
          echo "FR_CRAWL_ONE_TIME_RUN=https://github.com/$GH_REPO/actions/runs/$crawl_id"
          echo "## FR 真正爬蟲執行" >> "$GITHUB_STEP_SUMMARY"
          echo "- FR 01: https://github.com/$GH_REPO/actions/runs/$crawl_id" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..600}; do
            line=$(gh api "$api/runs/$crawl_id" --jq '[.status,.conclusion] | join("|")')
            IFS='|' read -r state conclusion <<< "$line"
            echo "FR_ONE_SHOT_CRAWL_STATUS=$state:$conclusion"
            if [[ "$state" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "FR 01 failed: $conclusion" >&2; exit 1; }
              break
            fi
            sleep 20
          done
          [[ "$state" == completed ]] || { echo 'FR 01 did not complete within test limit' >&2; exit 1; }
          db_id=""
          for attempt in {1..50}; do
            db_id=$(gh api "$api/workflows/db-distributed.yml/runs?per_page=100" --jq \
              "[.workflow_runs[] | select(.event==\"workflow_run\" and .head_sha==\"$GITHUB_SHA\")] | sort_by(.id) | last | .id // empty")
            [[ -n "$db_id" ]] && break
            sleep 6
          done
          [[ -n "$db_id" ]] || { echo 'Crawler succeeded but 15 DB workers were not automatically triggered' >&2; exit 1; }
          echo "FR_DB_ONE_TIME_RUN=https://github.com/$GH_REPO/actions/runs/$db_id"
          echo "- DB 15+17: https://github.com/$GH_REPO/actions/runs/$db_id" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..600}; do
            line=$(gh api "$api/runs/$db_id" --jq '[.status,.conclusion] | join("|")')
            IFS='|' read -r state conclusion <<< "$line"
            echo "FR_ONE_SHOT_DB_STATUS=$state:$conclusion"
            if [[ "$state" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "FR DB failed: $conclusion" >&2; exit 1; }
              break
            fi
            sleep 20
          done
          [[ "$state" == completed ]] || { echo 'FR DB did not complete within test limit' >&2; exit 1; }
          release_id=""
          for attempt in {1..50}; do
            release_id=$(gh api "$api/workflows/sqlite-release.yml/runs?per_page=100" --jq \
              "[.workflow_runs[] | select(.event==\"workflow_dispatch\" and .head_sha==\"$GITHUB_SHA\")] | sort_by(.id) | last | .id // empty")
            [[ -n "$release_id" ]] && break
            sleep 6
          done
          [[ -n "$release_id" ]] || { echo 'DB succeeded but SQLite deployment was not triggered' >&2; exit 1; }
          echo "FR_SQLITE_ONE_TIME_RUN=https://github.com/$GH_REPO/actions/runs/$release_id"
          echo "- SQLite Pages: https://github.com/$GH_REPO/actions/runs/$release_id" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..600}; do
            line=$(gh api "$api/runs/$release_id" --jq '[.status,.conclusion] | join("|")')
            IFS='|' read -r state conclusion <<< "$line"
            echo "FR_ONE_SHOT_SITE_STATUS=$state:$conclusion"
            if [[ "$state" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "FR website failed: $conclusion" >&2; exit 1; }
              break
            fi
            sleep 20
          done
          [[ "$state" == completed ]] || { echo 'FR website did not complete within test limit' >&2; exit 1; }
          echo 'FR_REAL_CRAWL_END_TO_END_SUCCESS=true' | tee -a "$GITHUB_STEP_SUMMARY"
