name: FoodRadar single-coordinate crawl
on:
  push:
    branches: [main]
  schedule:
    # Asia/Taipei 06:30 and 18:30 daily; GitHub schedules use UTC.
    - cron: '30 10,22 * * *'
    # 07:30/19:30 backup: check Turso first; do NOT duplicate successful crawls.
    - cron: '30 11,23 * * *'
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Initialize/retry Turso from the latest HF Raw (skip a new crawl)
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish-site:
    name: Publish website without waiting for crawler
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[audit-bingdoujiang]') && !contains(github.event.head_commit.message, '[audit-lairfu]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: foodradar-pages-fast-release
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal database verification dependency
        run: pip install 'requests>=2.32,<3'
      - name: Configure verified read-only site and release manifest
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: |
          python scripts/configure_web.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          sha = os.environ['GITHUB_SHA']
          timestamp = datetime.now(timezone(timedelta(hours=8)))
          manifest = {
              'version': 'web-' + sha[:12],
              'buildTime': timestamp.strftime('%Y-%m-%d %H:%M:%S +08:00'),
              'commit': sha,
              'batch': 'web-only',
          }
          Path('web/version.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + chr(10), encoding='utf-8')
          print('Website-only release:', manifest['version'])
          PY
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/data-contract.js
          if grep -q 'id="archive-quote-section"' web/index.html; then
            echo 'Retired HF quote section still exists' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published site no longer contains archived menu quotes
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          base = 'https://fafagoback.github.io/FoodRadar/'
          expected = os.environ['GITHUB_SHA']
          for attempt in range(10):
              try:
                  url = base + '?_release=' + expected[:12] + '&attempt=' + str(attempt)
                  with urlopen(Request(url, headers={'Cache-Control':'no-cache'}), timeout=20) as response:
                      html = response.read().decode('utf-8')
                  with urlopen(base + 'version.json?_release=' + expected[:12] + '&attempt=' + str(attempt), timeout=20) as response:
                      manifest = json.load(response)
                  if manifest.get('commit') == expected and 'archive-quote-section' not in html and 'HF 歷史菜單參考價' not in html:
                      print('LIVE_PAGE_CONFIRMED_REMOVED', manifest['version'])
                      break
                  print('Waiting for current Pages release:', manifest.get('commit'), attempt + 1)
              except Exception as error:
                  print('Live release verification retry:', type(error).__name__, str(error)[:200])
              if attempt == 9:
                  raise SystemExit('Live Pages deployment was not verified')
              time.sleep(6)
          PY
  audit-lairfu-raw:
    name: Read-only HF investigation of 3062 士銓 波霸黑糖奶茶
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-lairfu]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only HF snapshot reader
        run: pip install 'huggingface_hub>=0.25,<1'
      - name: Audit historical raw menu and latest native getStoreV1 evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os,sys,re,json,tarfile,gzip,tempfile,sqlite3,shutil
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download
          sys.path.insert(0,'src')
          from json_to_db import extract_promo_info
          repo='hub-google/UberEat'
          api=HfApi(token=os.environ.get('HF_TOKEN'))
          files=api.list_repo_files(repo_id=repo,repo_type='dataset')
          manifests=sorted(p for p in files if p.startswith('FoodRadar/snapshots/') and p.endswith('/complete.json') and p.split('/')[2][:8]>='20261022')
          print('SELECTED_ARCHIVES',len(manifests),[p.split('/')[2] for p in manifests],flush=True)
          def match_store(s):
              s=str(s or '')
              return ('士銓' in s or '3062' in s) and '萊爾富' in s
          def emit(name,obj):
              print(name+'='+json.dumps(obj,ensure_ascii=False,default=str),flush=True)
          for manifest in manifests:
              meta=json.loads(Path(hf_hub_download(repo,manifest,repo_type='dataset')).read_text())
              batch=meta['batch_id']
              archive=hf_hub_download(repo,meta['archive_path'],repo_type='dataset')
              found=0
              with tarfile.open(archive,'r:gz') as tar:
                  members=tar.getmembers()
                  for member in members:
                      if not(member.isfile() and member.name.startswith('Json/') and member.name.endswith('.json')):continue
                      doc=json.load(tar.extractfile(member))
                      if not match_store(doc.get('name')):continue
                      matched=[]
                      for sec in (doc.get('hasMenu') or {}).get('hasMenuSection') or []:
                          category=str(sec.get('name') or '')
                          for item in sec.get('hasMenuItem') or []:
                              name=str(item.get('name') or '')
                              if '波霸黑糖奶茶' not in name:continue
                              promo,qty=extract_promo_info(category,name,str(item.get('description') or ''))
                              promo=str(item.get('promo_type') or promo)
                              qty=int(item.get('quantity') or qty)
                              price=(item.get('offers') or {}).get('price')
                              matched.append(dict(name=name,uuid=item.get('identifier'),section=category,
                                 list_price=price,source=item.get('promotion_source'),
                                 native_promo=item.get('promo_type'),promo=promo,qty=qty,
                                 unit=round(float(price)/qty,2) if price and qty>0 else None))
                      if matched:
                          found+=1
                          emit('TARGET_RAW',dict(batch=batch,store=doc.get('name'),store_uuid=doc.get('store_uuid'),
                              time=doc.get('captured_at'),isOpen=doc.get('isOpen'),
                              closedMessage=doc.get('closedMessage'),hasStorePromotion=doc.get('hasStorePromotion'),
                              matches=matched))
                  if batch.startswith('20261029'):
                      for member in members:
                          if not(member.isfile() and member.name.startswith('ApiRaw/') and member.name.endswith('.json')):continue
                          wrapper=json.load(tar.extractfile(member))
                          data=wrapper.get('data') or {}
                          if not match_store(data.get('title')):continue
                          occurrences=[]
                          for group,secs in (data.get('catalogSectionsMap') or {}).items():
                              for sec in secs if isinstance(secs,list) else []:
                                  payload=(sec.get('payload') or {}).get('standardItemsPayload') or {}
                                  label=payload.get('title') or {}
                                  label=label.get('text') if isinstance(label,dict) else label
                                  for item in payload.get('catalogItems') or []:
                                      if '波霸黑糖奶茶' not in str(item.get('title') or ''):continue
                                      occurrences.append(dict(group=group,section=label,title=item.get('title'),
                                          uuid=item.get('uuid') or item.get('itemUuid'),price_cents=item.get('price'),
                                          keys=sorted(item),promo_fields={k:v for k,v in item.items() if re.search('promo|offer|discount|benefit|reward|bogo|deal',k,re.I)}))
                          emit('TARGET_NATIVE',dict(batch=batch,store=data.get('title'),
                              store_promotion=data.get('hasStorePromotion'),occurrences=occurrences))
              if not found:emit('TARGET_NOT_IN_BATCH',dict(batch=batch))
          try:
              manifest=json.loads(Path(hf_hub_download(repo,'FoodRadar/state/latest.json',repo_type='dataset')).read_text())
              archived_state=hf_hub_download(repo,manifest['state_path'],repo_type='dataset')
              with tempfile.TemporaryDirectory() as folder:
                  db=Path(folder)/'state.db'
                  with gzip.open(archived_state,'rb') as src,db.open('wb') as dst:shutil.copyfileobj(src,dst)
                  con=sqlite3.connect(db)
                  con.row_factory=sqlite3.Row
                  rows=con.execute("SELECT s.name AS store,p.product_name,p.product_uuid,p.price,p.menu_quote_price,p.promo_type,p.menu_quote_promo_type,p.quantity,p.menu_quote_quantity,p.menu_quote_history FROM products p JOIN stores s USING(store_uuid) WHERE p.product_name LIKE '%波霸黑糖奶茶%' AND (s.name LIKE '%士銓%' OR s.name LIKE '%3062%')").fetchall()
                  for row in rows:
                      item=dict(row)
                      item['menu_quote_history']=json.loads(item.get('menu_quote_history') or '[]')
                      emit('TARGET_HF_DB',dict(state_batch=manifest.get('batch_id'),**item))
                  con.close()
          except Exception as e:emit('STATE_INSPECT_ERROR',str(e)[:400])
          PY
  audit-soymilk-raw:
    name: Inspect historical HF RAW for 世界豆漿大王 冰豆漿
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-bingdoujiang]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HF read-only dependencies
        run: pip install 'huggingface_hub>=0.25,<1'
      - name: Read original HF menu captures and promo sections
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_soymilk_raw.py
  schedule-recovery:
    name: Recover only if scheduled crawl was missed
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 11,23 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Turso has the latest scheduled window
        id: check
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/should_crawl_backup.py
  crawl:
    needs: [schedule-recovery]
    if: ${{ always() && !contains(github.event.head_commit.message, '[audit-bingdoujiang]') && !contains(github.event.head_commit.message, '[audit-lairfu]') && (github.event_name != 'schedule' || github.event.schedule != '30 11,23 * * *' || needs.schedule-recovery.outputs.needed == 'true') }}
    # Limit only the database publisher. Browser QA must not monopolize the
    # release lock or block deployment of a newer commit.
    concurrency:
      group: foodradar-publisher-v2
      cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[emergency-stop-rebuild]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check website JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/data-contract.js
          node tests/web_contract.cjs
          node tests/price_history.cjs
          node tests/web_interactions.cjs
          node tests/packed_concurrency.cjs
      - name: Crawl one location and upload to HF
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[crawl-now]')) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/crawl.py --upload
      - name: Recover pre-rebuild verified HF checkpoint
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-pre-rebuild-state]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/restore_pre_rebuild_checkpoint.py
      - name: Restore latest verified HF Raw for initialization or retry
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[crawl-now]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_existing) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FOODRADAR_REBUILD_VALID_PRICE_HISTORY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-price-history]') && '1' || '0' }}
        run: python scripts/prepare_hf_release.py
      - name: Inspect original HF RAW for 士林 楊桃甘露 price and promo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_yuchi_yangtao_raw.py
      - name: Audit all HF raw price sources from the last seven days
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_hf_price_history.py
      - name: Diagnose saved effective-price oscillations
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/audit_price_oscillations.py "data/$BATCH/serving.db"
      - name: Verify BOGO category and open-state against stored Raw snapshots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/verify_bogo_raw_snapshots.py
      - name: Verify historical list prices and BOGO labels rebuilt from HF RAW
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-price-history]') }}
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          batch=Path('data/latest.txt').read_text().strip()
          con=sqlite3.connect(Path('data')/batch/'serving.db')
          row=con.execute("""SELECT p.menu_quote_history FROM products p
            JOIN stores s ON s.store_uuid=p.store_uuid
            WHERE p.product_uuid='93a0fb60-4af4-56a1-b696-3abb420007ea'
              AND s.name LIKE '%世界豆漿大王%' AND s.name LIKE '%民族%'""").fetchone()
          if row is None:raise SystemExit('Expected HF soy milk SKU not found')
          history=json.loads(row[0])
          if not history or any(len(p)<5 for p in history):
              raise SystemExit('Historical RAW list price or promotion missing')
          if any(not isinstance(p[2],(int,float)) or not p[3] or p[4]<1 for p in history):
              raise SystemExit('Invalid historical RAW price, promotion or quantity')
          if batch=='20261027235841':
              before=[p for p in history if p[0].startswith('2026-10-24')]
              after=[p for p in history if p[0].startswith('2026-10-25')]
              if not (before and after
                  and all(p[1]==58 and p[2]==58 and p[3]=='無' and p[4]==1 for p in before)
                  and all(p[1]==29 and p[2]==58 and p[3]=='買1送1' and p[4]==2 for p in after)):
                  raise SystemExit('HF soy milk original/BOGO history mismatch')
          print('HF_RAW_HISTORY_LABELS_VERIFIED',json.dumps({
              'batch':batch,'sku':'冰豆漿(冰有糖)','history_count':len(history),
              'samples':history[-4:]},ensure_ascii=False))
          con.close()
          PY
      - name: Audit latest verified price comparisons and nonzero deal eligibility
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/audit_deal_pipeline.py "data/$BATCH/serving.db"
      - name: Publish only necessary Turso rows and verify before commit
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.FOODRADAR_TURSO_WRITE_TOKEN }}
          FOODRADAR_REBUILD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-price-history]') && '1' || '0' }}
          FOODRADAR_RESET: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[reset-turso]') && '1' || '0' }}
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/verify_packed_local.py "data/$BATCH/packed-serving.db" --report packed-report.json
          EXTRA=()
          if [ "$FOODRADAR_REBUILD" = "1" ]; then
            EXTRA=(--verified-rebuild-manifest "data/$BATCH/verified-rebuild.json")
          fi
          if [ "$FOODRADAR_RESET" = "1" ]; then
            EXTRA+=(--reset-all)
          fi
          python scripts/publish_turso_delta.py "data/$BATCH/packed-serving.db" --apply "${EXTRA[@]}" --report delta-report.json
      - name: Independently query live Turso price statistics (read only)
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/audit_live_turso.py
      - name: Verify Burger King discounted price in published web dataset
        run: python scripts/verify_burger_king_price.py
      - name: Persist fully rebuilt valid-price checkpoint after verified Turso write
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-price-history]') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/persist_valid_price_checkpoint.py
      - name: Configure verified read-only website connection
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: |
          python scripts/configure_web.py
          python scripts/prepare_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-report
          path: data/**/report.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serving-validation
          path: |
            packed-report.json
            delta-report.json
          retention-days: 3
      - uses: actions/configure-pages@v5
        if: github.event_name != 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'push'
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'push'
        id: deployment
  live-site-acceptance:
    name: Verify deployed website
    if: github.event_name != 'push'
    needs: crawl
    # The published Pages URL always points at the newest release. A slow
    # Chromium install for an older SHA must be cancelled once a newer
    # deployment queues its acceptance job, not reported as a price failure.
    # Keep this lock separate from the crawl/Turso publisher so browser
    # installation never blocks newer database releases.
    concurrency:
      group: foodradar-live-qa-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live site (30-percent deals)
        run: node tests/live_site.cjs
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
