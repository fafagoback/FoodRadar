name: FoodRadar 02｜爬蟲與資料庫
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prototype_pack_db.py'
      - 'src/crawl.py'
      - 'src/feed_core.py'
      - 'src/raw_capture.py'
      - 'src/pipeline.py'
      - 'scripts/publish_turso_delta.py'
      - '.github/workflows/crawl.yml'
  schedule:
    # 台灣時間每日 06:30、18:30，GitHub cron 使用 UTC。
    - cron: '30 10,22 * * *'
    # 台灣時間 07:30、19:30：只在上一輪漏跑時補抓。
    - cron: '30 11,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'crawl=新抓取；republish=重發現有 HF；full-rebuild=全量重建 Turso'
        required: true
        type: choice
        options:
          - crawl
          - republish
          - full-rebuild
        default: crawl
      confirm_reset:
        description: 'full-rebuild 必須輸入 REBUILD_V2，其餘模式留白'
        required: false
        type: string
permissions:
  contents: read
jobs:
  schedule-recovery:
    name: 只在排程漏跑時執行補抓
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 11,23 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 Turso 是否已有上一時段資料
        id: check
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/should_crawl_backup.py

  ingest:
    name: HF 原始資料 → V2 價格 → Turso
    needs: [schedule-recovery]
    if: ${{ always() && (github.event_name != 'schedule' || github.event.schedule != '30 11,23 * * *' || needs.schedule-recovery.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # 防止未受保護的 main 變更在排程中寫壞正式資料庫。
      - name: 更新資料前再次執行核心程式回歸測試
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/data-contract.js

      - name: 禁止未確認的正式資料庫重建
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-rebuild' }}
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
        run: |
          if [ "$CONFIRM_RESET" != "REBUILD_V2" ]; then
            echo '全量重建需明確輸入 REBUILD_V2' >&2
            exit 1
          fi

      - name: 封存未修改的 Feed / Store 原始 HTTP 回應至 HF FoodRadar/Raw
        if: >-
          ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(raw): launch first immutable HF capture')) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/crawl.py --upload

      - name: 僅從 HF FoodRadar/Raw 重建 DB（禁止混入舊快照）
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FOODRADAR_REBUILD_VALID_PRICE_HISTORY: ${{ inputs.mode == 'full-rebuild' && '1' || '0' }}
        run: python scripts/prepare_hf_release.py

      - name: 檢查原生計價證據及不合法優惠
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          batch = Path('data/latest.txt').read_text().strip()
          db = Path('data') / batch / 'serving.db'
          con = sqlite3.connect(db)
          assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          types = dict(con.execute(
              "SELECT promotion_type, COUNT(*) FROM product_price_observations GROUP BY promotion_type"))
          assert types.get('NONE', 0) > 0, '沒有已驗證的一般商品價格'
          assert types.get('SAME_SKU_BXGY', 0) > 0, '沒有原生同商品買送資料'
          assert types.get('DIRECT_DISCOUNT', 0) > 0, '沒有原生直接折價資料'
          assert set(types) <= {'NONE','SAME_SKU_BXGY','DIRECT_DISCOUNT'}
          bad = con.execute("""SELECT COUNT(*) FROM products
              WHERE seven_day_is_price_deal = 1 AND
              (price_evidence_status != 'VERIFIED_MENU' OR delivery_available != 1)""").fetchone()[0]
          assert bad == 0, '未驗證價格混入降價商品'
          print('V2_PREPUBLICATION=' + json.dumps(
              {'batch': batch,'verified_types': types,'invalid_deals': bad},
              ensure_ascii=False), flush=True)
          PY

      - name: 獨立核對七日最高有效價格
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/audit_deal_pipeline.py "data/$BATCH/serving.db"

      - name: 完整驗證後才發布 Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.FOODRADAR_TURSO_WRITE_TOKEN }}
          FOODRADAR_FULL_REBUILD: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-rebuild') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fix(raw): reset dirty Turso from clean HF Raw')) && '1' || '0' }}
        run: |
          BATCH=$(cat data/latest.txt)
          python scripts/verify_packed_local.py "data/$BATCH/packed-serving.db" --report packed-report.json
          EXTRA=()
          if [ "$FOODRADAR_FULL_REBUILD" = "1" ]; then
            EXTRA=(--verified-rebuild-manifest "data/$BATCH/verified-rebuild.json" --reset-all)
          fi
          python scripts/publish_turso_delta.py "data/$BATCH/packed-serving.db" --apply "${EXTRA[@]}" --report delta-report.json

      - name: 以獨立唯讀連線驗證正式 Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.FOODRADAR_TURSO_DATABASE_URL }}
          TURSO_READONLY_TOKEN: ${{ secrets.FOODRADAR_TURSO_READONLY_TOKEN }}
        run: python scripts/audit_live_turso.py

      - name: 全量重建成功後更新 HF V2 checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-rebuild' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/persist_valid_price_checkpoint.py

      - name: 保存驗證報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-data-validation
          path: |
            data/**/report.json
            packed-report.json
            delta-report.json
          if-no-files-found: ignore
          retention-days: 5
