    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_wave_12.result == 'success' && needs.plan_wave_12.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_wave_12.outputs.progress }}

  recover_wave_13:
    name: "接手 13｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_wave_13]
    if: ${{ !cancelled() && needs.plan_wave_13.result == 'success' && needs.plan_wave_13.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_wave_13.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '13'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w13
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_wave_14:
    name: 任務池檢查｜接手輪次 14
    needs: [discover_once, recover_wave_13, plan_wave_13]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_wave_13.result == 'success' && needs.plan_wave_13.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_wave_13.outputs.progress }}

  recover_wave_14:
    name: "接手 14｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_wave_14]
    if: ${{ !cancelled() && needs.plan_wave_14.result == 'success' && needs.plan_wave_14.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_wave_14.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '14'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w14
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_complete:
    name: 驗證全部任務池已完整結束
    needs: [discover_once, crawl_shard, plan_recovery, recover_shard, plan_wave_02, recover_wave_02, plan_wave_03, recover_wave_03, plan_wave_04, recover_wave_04, plan_wave_05, recover_wave_05, plan_wave_06, recover_wave_06, plan_wave_07, recover_wave_07, plan_wave_08, recover_wave_08, plan_wave_09, recover_wave_09, plan_wave_10, recover_wave_10, plan_wave_11, recover_wave_11, plan_wave_12, recover_wave_12, plan_wave_13, recover_wave_13, plan_wave_14, recover_wave_14]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: '-1'
      - name: 確認無未完成店家或分類
        env:
          REMAINING: ${{ steps.plan.outputs.missing_count }}
        run: |
          test "$REMAINING" = 0 || { echo '仍有未完成任務，禁止寫入資料庫及部署'; exit 1; }


  ingest:
    name: 第十六台｜彙整驗證與發布靜態資料
    needs: [prepare_run, discover_once, crawl_shard, plan_recovery, recover_shard, plan_complete]
    if: "${{ !cancelled() && needs.prepare_run.result == 'success' && ((needs.discover_once.result == 'success' && needs.plan_complete.result == 'success') || (needs.crawl_shard.result == 'skipped' && needs.discover_once.result == 'skipped' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'crawl')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    environment:
      name: github-pages
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements.txt
      # 任何手動資料庫更新前，都重新驗證核心程式。
      - name: 更新資料前再次執行核心程式回歸測試
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/static-catalog.js
          node --check web/data-contract.js

      - name: 禁止未確認的正式資料庫重建
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-rebuild' }}
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
        run: |
          if [ "$CONFIRM_RESET" != "REBUILD_V2" ]; then
            echo '全量重建需明確輸入 REBUILD_V2' >&2
            exit 1
          fi

      - name: 下載本次所有逐店保存成果
        if: ${{ needs.discover_once.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: fr-task-${{ needs.discover_once.outputs.epoch }}-*
          path: data/tasks
          merge-multiple: false
      - name: 下載工作機統計
        if: ${{ needs.discover_once.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: fr-worker-${{ needs.discover_once.outputs.epoch }}-*
          path: data/worker-summaries
          merge-multiple: false
      - name: 下載本次驗證過的原始店家清單
        if: ${{ needs.discover_once.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 驗證共用任務池全部完成且無重複店家，再組裝既有格式
        if: ${{ needs.discover_once.result == 'success' }}
        run: python src/dynamic_crawl.py assemble

      - name: 交叉核對店家覆蓋率與原始 HTTP SHA-256，統一上傳 HF Raw
        if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
        env:
          HF_TOKEN: "${{ secrets.HF_TOKEN }}"
        # Preserve strict per-store verification, discovery coverage and HTTP hashes.
        # Restore the previously tested fail-closed quarantine policy for known
        # deterministic catalog gaps only (<=5%, >=50 verified stores).
        # The failed stores' previous verified state is retained, not overwritten.
        # Unknown errors and missing or invalid artifacts still abort publication.
        run: python src/distributed_crawl.py merge --count ${{ needs.discover_once.outputs.batch_count }} --input-dir data/parts --upload --discovery-file data/discovery/discovery.json

      - name: 保存所有工作機平均最佳執行緒至 Repo
        if: ${{ success() && needs.discover_once.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FOODRADAR_BATCH_COUNT: ${{ needs.discover_once.outputs.batch_count }}
        run: python scripts/save_crawl_settings.py
      - name: 恢復經驗證的 SQLite 加速快取（不影響 HF Raw）
        if: ${{ inputs.mode != 'full-rebuild' }}
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            foodradar-state-v1-
      - name: 直接更新精簡資料庫、完整稽核並建置網站資料
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FOODRADAR_REBUILD_VALID_PRICE_HISTORY: ${{ inputs.mode == 'full-rebuild' && '1' || '0' }}
        run: python scripts/prepare_hf_release.py
      - name: 保存經完整資料與網站雜湊驗收的精簡資料庫
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 整理已驗證資料供 Pages Artifact 使用（不提交 Git、不上傳 HF 靜態副本）
        run: |
          BATCH=$(cat data/latest.txt)
          mkdir -p pages-static-source
          cp -a "data/$BATCH/static-public/." pages-static-source/
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_static_catalog import verify
          manifest = verify(Path('pages-static-source'))
          print('FOODRADAR_ARTIFACT_SOURCE_VERIFIED=' + manifest['batch'], flush=True)
          PY
      - name: 保存已驗證靜態資料為 Pages 來源 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-static-source
          path: pages-static-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: 保存驗證報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-data-validation
          path: |
            data/**/report.json
            data/**/store-identity-report.json
            data/**/direct-db-report.json
            data/**/quarantine-report.json
            packed-report.json
            data/**/static-public/current.json
            data/**/shard-reconciliation.json
          if-no-files-found: ignore
          retention-days: 5
      - name: 移除已完成的臨時任務池分支
        if: ${{ success() && needs.discover_once.result == 'success' }}
        run: python src/dynamic_crawl.py cleanup

      - name: 保存本次實際執行指標
        if: ${{ !cancelled() }}
        run: python scripts/action_summary.py capture
      - name: 上傳本次統計指標
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-run-metrics
          path: action-reports/metrics/
          if-no-files-found: warn
          retention-days: 5

  report:
    name: 彙整本次繁體中文爬蟲報告
    needs: [prepare_run, discover_once, crawl_shard, plan_recovery, recover_shard, plan_complete, ingest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 下載本次統計指標
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: foodradar-run-metrics
          path: action-reports/metrics
      - name: 產生繁體中文抓取與更新報告
        env:
          DISCOVER_RESULT: ${{ needs.discover_once.result }}
          SHARD_RESULT: ${{ needs.crawl_shard.result }}
          RECOVERY_PLAN_RESULT: ${{ needs.plan_recovery.result }}
          RECOVERY_RESULT: ${{ needs.recover_shard.result }}
          RECOVERY_COUNT: ${{ needs.plan_recovery.outputs.missing_count }}
          INGEST_RESULT: ${{ needs.ingest.result }}
        run: python scripts/action_summary.py crawl

  request-deployment:
    name: 資料與稽核全部成功後才啟動網站部署
    needs: [ingest, report]
    if: ${{ !cancelled() && needs.ingest.result == 'success' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: 核對來源版本並通知網站部署
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '有更新版本排隊，舊版資料不部署。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_sha="$GITHUB_SHA"
          echo '來源資料與稽核均已成功，已通知 02；02 仍會等待整個 01 完成才發布。' >> "$GITHUB_STEP_SUMMARY"
