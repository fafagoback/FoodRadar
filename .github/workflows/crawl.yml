name: FoodRadar 01｜資料爬取與更新
run-name: FoodRadar｜暫停爬蟲並移除指定舊任務
on:
  push:
    branches: [main]
    paths: ['.github/workflows/crawl.yml']
permissions:
  contents: read
concurrency:
  group: foodradar-crawl-pipeline-v2
  cancel-in-progress: true
jobs:
  stop:
    if: ${{ contains(github.event.head_commit.message, 'FR_PAUSE_AND_DELETE_461') }}
    name: 停止並刪除指定 RUN #461（不爬取、不部署）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          target="repos/$GITHUB_REPOSITORY/actions/runs/45522293376"
          status=$(gh api "$target" --jq .status)
          if [[ "$status" != completed ]]; then
            gh api -X POST "$target/force-cancel" || gh api -X POST "$target/cancel" || true
          fi
          for i in {1..50}; do
            [[ "$(gh api "$target" --jq .status)" == completed ]] && break
            sleep 3
          done
          test "$(gh api "$target" --jq .status)" = completed
          gh api -X DELETE "$target"
          echo '已刪除指定 RUN #461；排程、爬取、資料庫更新及部署全部不執行。' >> "$GITHUB_STEP_SUMMARY"
