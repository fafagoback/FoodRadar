name: FoodRadar 01｜資料爬取與更新
run-name: 'FoodRadar 01｜資料爬取與更新｜執行編號 #${{ github.run_number }}'
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_static_catalog.py'
      - 'src/price_oscillation.py'
      - 'src/pipeline.py'
      - 'src/state_checkpoint.py'
      - 'src/compact_direct.py'
      - 'scripts/direct_projection.py'
      - 'src/canonical_history.py'
      - 'scripts/prepare_hf_release.py'
      - 'scripts/prototype_pack_db.py'
      - 'scripts/prepare_pages.py'
      - 'tests/live_site.cjs'
      - '.github/workflows/pages.yml'
      - 'src/raw_capture.py'
      - 'src/catalog_complete.py'
      - 'src/distributed_crawl.py'
      - 'src/adaptive_threads.py'
      - 'src/crawl_batches.py'
      - 'src/crawl_transport.py'
      - 'scripts/save_crawl_settings.py'
      - 'tests/test_immutable_raw_capture.py'
      - 'src/verified_weekly.py'
      - 'scripts/audit_deal_pipeline.py'
      - 'tests/test_price_oscillation.py'
      - '.github/workflows/crawl.yml'
  # 每天台灣時間 06:30、18:30 自動更新（UTC 前一天 22:30、當天 10:30）。
  # 規則程式 push 只重算既有 Raw 並重發，不啟動 15 台爬蟲。
  schedule:
    - cron: '30 10,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'crawl=新抓取；republish=從既有 Raw 重發 Pages；full-rebuild=從 Raw 重建靜態資料'
        required: true
        type: choice
        options:
          - crawl
          - republish
          - full-rebuild
        default: crawl
      confirm_reset:
        description: 'full-rebuild 必須輸入 REBUILD_V2，其餘模式留白'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: foodradar-crawl-pipeline-v2
  cancel-in-progress: true
jobs:
  prepare_run:
    name: 停止同類舊任務並清理臨時執行紀錄
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: 確認舊版執行已停止後才開始資料作業
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          runs=$(gh api "$api/workflows/crawl.yml/runs?branch=main&per_page=100" --jq '.workflow_runs[] | [.id,.run_number,.status] | map(tostring) | join("|")')
          while IFS="|" read -r id number state; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" && "$number" -lt "$GITHUB_RUN_NUMBER" && "$state" != completed ]] || continue
            if ! gh api -X POST "$api/runs/$id/force-cancel"; then
              state=$(gh api "$api/runs/$id" --jq .status)
              [[ "$state" == completed ]] || gh api -X POST "$api/runs/$id/cancel"
            fi
            for i in {1..60}; do
              state=$(gh api "$api/runs/$id" --jq .status)
              [[ "$state" == completed ]] && break
              sleep 3
            done
            [[ "$state" == completed ]] || { echo "舊任務 #$number 未停止，禁止開始新作業" >&2; exit 1; }
            if [[ "$(gh api "$api/runs/$id" --jq .conclusion)" == cancelled ]]; then
              gh api -X DELETE "$api/runs/$id"
            fi
            echo "已停止舊版 #$number" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$runs"

      - name: 一次性清除本次以前所有已結束的 Workflow 紀錄
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          # Snapshot IDs before deleting, so pagination cannot skip shifted entries.
          gh api --paginate "$api/runs?status=completed&per_page=100" --jq '.workflow_runs[].id' > "$RUNNER_TEMP/fr-old-runs.txt"
          count=0
          while IFS= read -r id; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || continue
            gh api -X DELETE "$api/runs/$id"
            count=$((count+1))
          done < "$RUNNER_TEMP/fr-old-runs.txt"
          echo "已刪除 $count 筆歷史執行紀錄；保留仍在執行的獨立研究及本次爬取。" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 清除已結束的臨時診斷及維護執行
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          ids=$(gh api "$api/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed" and ((.head_branch // "") | test("^(maintenance|diagnostic)/"))) | .id')
          count=0
          while IFS= read -r id; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || continue
            gh api -X DELETE "$api/runs/$id"
            count=$((count+1))
          done <<< "$ids"
          echo "已清理臨時執行 $count 筆；保留 01、02 正式歷史。" >> "$GITHUB_STEP_SUMMARY"

  discover_once:
    name: 統一掃描單一座標，產出 15 台共用店家清單
    needs: prepare_run
    if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      batch_count: ${{ steps.plan.outputs.batch_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      initial_threads: ${{ steps.plan.outputs.initial_threads }}
      epoch: ${{ steps.plan.outputs.epoch }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements-crawl.txt
      - name: 單次 Feed 掃描與儲存原始 HTTP
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/distributed_crawl.py discover
      - name: 建立 GitHub 共用分批佇列及讀取最佳執行緒
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(jq -er '.owner_count' data/discovery/discovery.json)
          matrix=$(jq -cn --argjson count "$count" '{shard:[range(0;$count)]}')
          value=$(gh api "repos/$GITHUB_REPOSITORY/contents/crawl-settings.json?ref=crawler-state" --jq .content | base64 -d | jq -er '.optimal_threads | select(type == "number" and . >= 1 and . <= 12 and . == floor)')
          epoch=$(sha256sum data/discovery/discovery.json | cut -c1-16)
          printf 'batch_count=%s\nmatrix=%s\ninitial_threads=%s\nepoch=%s\n' "$count" "$matrix" "$value" "$epoch" >> "$GITHUB_OUTPUT"
          echo "已建立 $count 個分批任務，最多 15 台同時處理，初始執行緒 $value" >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳全機器共用店家清單
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-shared-feed-${{ steps.plan.outputs.epoch }}
          path: data/discovery/
          if-no-files-found: error
          retention-days: 3

  crawl_shard:
    name: "動態排程｜任務批次 ${{ matrix.shard }}"
    needs: discover_once
    continue-on-error: true
    if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.discover_once.outputs.matrix) }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements-crawl.txt
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 多店並行、自動調整執行緒並完整爬取
        env:
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
        run: python src/distributed_crawl.py shard --index ${{ matrix.shard }} --count ${{ needs.discover_once.outputs.batch_count }} --discovery-file data/discovery/discovery.json
      - name: 上傳已產出完整任務清單的原始資料
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-raw-shard-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1

  plan_recovery:
    name: 確認中斷工作機尚未保存的任務
    needs: [discover_once, crawl_shard]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.missing.outputs.matrix }}
      missing_count: ${{ steps.missing.outputs.missing_count }}
    steps:
      - name: 只分派不存在成果的批次
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
          EPOCH: ${{ needs.discover_once.outputs.epoch }}
          BATCH_COUNT: ${{ needs.discover_once.outputs.batch_count }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/fr-artifacts"
          python - <<'PY'
          import json,os
          from pathlib import Path
          found=set((Path(os.environ["RUNNER_TEMP"])/"fr-artifacts").read_text().splitlines())
          prefix="foodradar-raw-shard-"+os.environ["EPOCH"]+"-"
          missing=[i for i in range(int(os.environ["BATCH_COUNT"])) if prefix+str(i) not in found]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps({"shard":missing},separators=(",",":"))+"\n")
              f.write("missing_count="+str(len(missing))+"\n")
          print("待接手批次："+str(missing))
          PY

  recover_shard:
    name: "故障接手｜未保存批次 ${{ matrix.shard }}"
    needs: [discover_once, plan_recovery]
    if: ${{ !cancelled() && needs.plan_recovery.result == 'success' && needs.plan_recovery.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_recovery.outputs.matrix) }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements-crawl.txt
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 多店並行、自動調整執行緒並完整爬取
        env:
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
        run: python src/distributed_crawl.py shard --index ${{ matrix.shard }} --count ${{ needs.discover_once.outputs.batch_count }} --discovery-file data/discovery/discovery.json
      - name: 上傳已產出完整任務清單的原始資料
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-raw-shard-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}
          path: data/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  ingest:
    name: 第十六台｜彙整驗證與發布靜態資料
    needs: [prepare_run, discover_once, crawl_shard, plan_recovery, recover_shard]
    if: "${{ !cancelled() && needs.prepare_run.result == 'success' && ((needs.discover_once.result == 'success' && needs.plan_recovery.result == 'success' && (needs.plan_recovery.outputs.missing_count == '0' || needs.recover_shard.result == 'success')) || (needs.crawl_shard.result == 'skipped' && needs.discover_once.result == 'skipped' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'crawl')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    environment:
      name: github-pages
    concurrency:
      group: foodradar-database-publisher
      cancel-in-progress: false
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements.txt
      # 任何手動資料庫更新前，都重新驗證核心程式。
      - name: 更新資料前再次執行核心程式回歸測試
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/packed-turso.js
          node --check web/static-catalog.js
          node --check web/data-contract.js

      - name: 禁止未確認的正式資料庫重建
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full-rebuild' }}
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
        run: |
          if [ "$CONFIRM_RESET" != "REBUILD_V2" ]; then
            echo '全量重建需明確輸入 REBUILD_V2' >&2
            exit 1
          fi

      - name: 下載所有已完成任務批次的原始檔案
        if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
        uses: actions/download-artifact@v4
        with:
          pattern: foodradar-raw-shard-${{ needs.discover_once.outputs.epoch }}-*
          path: data/parts
          merge-multiple: false
      - name: 下載本次驗證過的原始店家清單
        if: ${{ needs.discover_once.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 整理本次唯一批次資料夾
        if: ${{ needs.discover_once.result == 'success' }}
        env:
          EPOCH: ${{ needs.discover_once.outputs.epoch }}
        run: |
          set -euo pipefail
          for p in data/parts/foodradar-raw-shard-"$EPOCH"-*; do
            [[ -d "$p" ]] || exit 1
            mv "$p" "data/parts/foodradar-raw-shard-${p##*-}"
          done

      - name: 交叉核對店家覆蓋率與原始 HTTP SHA-256，統一上傳 HF Raw
        if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
        env:
          HF_TOKEN: "${{ secrets.HF_TOKEN }}"
        run: python src/distributed_crawl.py merge --count ${{ needs.discover_once.outputs.batch_count }} --input-dir data/parts --upload --strict --discovery-file data/discovery/discovery.json

      - name: 保存所有工作機平均最佳執行緒至 Repo
        if: ${{ success() && needs.discover_once.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FOODRADAR_BATCH_COUNT: ${{ needs.discover_once.outputs.batch_count }}
        run: python scripts/save_crawl_settings.py
      - name: 恢復經驗證的 SQLite 加速快取（不影響 HF Raw）
        if: ${{ inputs.mode != 'full-rebuild' }}
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            foodradar-state-v1-
      - name: 直接更新精簡資料庫、完整稽核並建置網站資料
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FOODRADAR_REBUILD_VALID_PRICE_HISTORY: ${{ inputs.mode == 'full-rebuild' && '1' || '0' }}
        run: python scripts/prepare_hf_release.py
      - name: 保存經完整資料與網站雜湊驗收的精簡資料庫
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 整理已驗證資料供 Pages Artifact 使用（不提交 Git、不上傳 HF 靜態副本）
        run: |
          BATCH=$(cat data/latest.txt)
          mkdir -p pages-static-source
          cp -a "data/$BATCH/static-public/." pages-static-source/
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_static_catalog import verify
          manifest = verify(Path('pages-static-source'))
          print('FOODRADAR_ARTIFACT_SOURCE_VERIFIED=' + manifest['batch'], flush=True)
          PY
      - name: 保存已驗證靜態資料為 Pages 來源 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-static-source
          path: pages-static-source/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: 保存驗證報告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-data-validation
          path: |
            data/**/report.json
            data/**/store-identity-report.json
            data/**/direct-db-report.json
            data/**/quarantine-report.json
            packed-report.json
            data/**/static-public/current.json
            data/**/shard-reconciliation.json
          if-no-files-found: ignore
          retention-days: 5
      - name: 保存本次實際執行指標
        if: ${{ !cancelled() }}
        run: python scripts/action_summary.py capture
      - name: 上傳本次統計指標
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-run-metrics
          path: action-reports/metrics/
          if-no-files-found: warn
          retention-days: 5

  report:
    name: 彙整本次繁體中文爬蟲報告
    needs: [prepare_run, discover_once, crawl_shard, plan_recovery, recover_shard, ingest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 下載本次統計指標
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: foodradar-run-metrics
          path: action-reports/metrics
      - name: 產生繁體中文抓取與更新報告
        env:
          DISCOVER_RESULT: ${{ needs.discover_once.result }}
          SHARD_RESULT: ${{ needs.crawl_shard.result }}
          RECOVERY_PLAN_RESULT: ${{ needs.plan_recovery.result }}
          RECOVERY_RESULT: ${{ needs.recover_shard.result }}
          RECOVERY_COUNT: ${{ needs.plan_recovery.outputs.missing_count }}
          INGEST_RESULT: ${{ needs.ingest.result }}
        run: python scripts/action_summary.py crawl

  request-deployment:
    name: 資料與稽核全部成功後才啟動網站部署
    needs: [ingest, report]
    if: ${{ !cancelled() && needs.ingest.result == 'success' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: 核對來源版本並通知網站部署
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '有更新版本排隊，舊版資料不部署。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_sha="$GITHUB_SHA"
          echo '來源資料與稽核均已成功，已通知 02；02 仍會等待整個 01 完成才發布。' >> "$GITHUB_STEP_SUMMARY"
