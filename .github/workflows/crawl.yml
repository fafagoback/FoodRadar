name: FoodRadar 01｜資料爬取與更新
run-name: 'FoodRadar 01｜資料爬取與更新｜執行編號 #${{ github.run_number }}'
on:
  # 僅明確標記 FR_CRAWL_SPEED_TEST 的流程更新可啟動額外完整爬取。
  push:
    branches: [main]
    paths: ['.github/workflows/crawl.yml']
  # 每日台灣時間 06:30、18:30（UTC 22:30、10:30）。
  schedule:
    - cron: '30 10,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'crawl=新抓取；republish=從既有 Raw 重發 Pages；full-rebuild=從 Raw 重建靜態資料'
        required: true
        type: choice
        options:
          - crawl
          - republish
          - full-rebuild
        default: crawl
      discovery_scope:
        description: 'single=原測試座標；taiwan=22縣市368行政區完整座標計畫'
        required: true
        type: choice
        options: [single, taiwan]
        default: single
      confirm_reset:
        description: 'full-rebuild 必須輸入 REBUILD_V2，其餘模式留白'
        required: false
        type: string
env:
  FR_DISCOVERY_SCOPE: ${{ inputs.discovery_scope || 'single' }}
permissions:
  contents: read
concurrency:
  group: foodradar-crawl-pipeline-v2
  # A checkpoint-only republish must preserve the currently running crawl.
  cancel-in-progress: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, 'FR_CHECKPOINT_MIGRATION')) }}
jobs:
  prepare_run:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST') }}
    name: 停止同類舊任務並清理臨時執行紀錄
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: 確認舊版執行已停止後才開始資料作業
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          runs=$(gh api "$api/workflows/crawl.yml/runs?branch=main&per_page=100" --jq '.workflow_runs[] | [.id,.run_number,.status] | map(tostring) | join("|")')
          while IFS="|" read -r id number state; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" && "$number" -lt "$GITHUB_RUN_NUMBER" && "$state" != completed ]] || continue
            if ! gh api -X POST "$api/runs/$id/force-cancel"; then
              state=$(gh api "$api/runs/$id" --jq .status)
              [[ "$state" == completed ]] || gh api -X POST "$api/runs/$id/cancel"
            fi
            for i in {1..60}; do
              state=$(gh api "$api/runs/$id" --jq .status)
              [[ "$state" == completed ]] && break
              sleep 3
            done
            [[ "$state" == completed ]] || { echo "舊任務 #$number 未停止，禁止開始新作業" >&2; exit 1; }
            if [[ "$(gh api "$api/runs/$id" --jq .conclusion)" == cancelled ]]; then
              gh api -X DELETE "$api/runs/$id"
            fi
            echo "已停止舊版 #$number" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$runs"

      - name: 一次性清除本次以前所有已結束的 Workflow 紀錄
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          # Snapshot IDs before deleting, so pagination cannot skip shifted entries.
          gh api --paginate "$api/runs?status=completed&per_page=100" --jq '.workflow_runs[].id' > "$RUNNER_TEMP/fr-old-runs.txt"
          count=0
          while IFS= read -r id; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || continue
            gh api -X DELETE "$api/runs/$id"
            count=$((count+1))
          done < "$RUNNER_TEMP/fr-old-runs.txt"
          echo "已刪除 $count 筆歷史執行紀錄；保留仍在執行的獨立研究及本次爬取。" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 清除已結束的臨時診斷及維護執行
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GH_REPO/actions"
          ids=$(gh api "$api/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed" and ((.head_branch // "") | test("^(maintenance|diagnostic)/"))) | .id')
          count=0
          while IFS= read -r id; do
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || continue
            gh api -X DELETE "$api/runs/$id"
            count=$((count+1))
          done <<< "$ids"
          echo "已清理臨時執行 $count 筆；保留 01、02 正式歷史。" >> "$GITHUB_STEP_SUMMARY"

  discover_once:
    name: 統一探索設定範圍，建立 15 台共用任務池
    needs: prepare_run
    if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    outputs:
      batch_count: ${{ steps.plan.outputs.batch_count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      initial_threads: ${{ steps.plan.outputs.initial_threads }}
      epoch: ${{ steps.plan.outputs.epoch }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件
        run: pip install -r requirements-crawl.txt
      - name: 掃描設定座標並儲存原始 HTTP
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/distributed_crawl.py discover --dynamic
      - name: 原子建立本次共用任務池（不使用歷史耗時）
        run: python src/dynamic_crawl.py init
      - name: 啟動固定 15 台工作機及讀取最佳執行緒
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(jq -er '.owner_count | select(. == 15)' data/discovery/discovery.json)
          matrix=$(jq -cn --argjson count "$count" '{include:[range(0;$count) | {shard:.,worker:(.+1|tostring|if length==1 then "0"+. else . end)}]}')
          value=$(gh api "repos/$GITHUB_REPOSITORY/contents/crawl-settings.json?ref=crawler-state" --jq .content | base64 -d | jq -er '.optimal_threads | select(type == "number" and . >= 1 and . <= 12 and . == floor)')
          epoch=$(sha256sum data/discovery/discovery.json | cut -c1-16)
          printf 'batch_count=%s\nmatrix=%s\ninitial_threads=%s\nepoch=%s\n' "$count" "$matrix" "$value" "$epoch" >> "$GITHUB_OUTPUT"
          echo "共用任務池由固定 $count 台工作機動態領取，每台持續執行及學習，初始執行緒 $value" >> "$GITHUB_STEP_SUMMARY"
      - name: 上傳全機器共用店家清單
        uses: actions/upload-artifact@v4
        with:
          name: foodradar-shared-feed-${{ steps.plan.outputs.epoch }}
          path: data/discovery/
          if-no-files-found: error
          retention-days: 3

  crawl_shard:
    name: "爬蟲工作機 ${{ matrix.worker }}"
    needs: discover_once
    continue-on-error: true
    if: "${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'FR_CRAWL_RESET_20261124') || contains(github.event.head_commit.message, 'FR_CRAWL_SPEED_TEST')))) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.discover_once.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '0'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w00
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1

  plan_recovery:
    name: 任務池檢查｜接手輪次 01
    needs: [discover_once, crawl_shard]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: '-1'

  recover_shard:
    name: "接手 01｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_recovery]
    if: ${{ !cancelled() && needs.plan_recovery.result == 'success' && needs.plan_recovery.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_recovery.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '1'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w01
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_wave_02:
    name: 任務池檢查｜接手輪次 02
    needs: [discover_once, recover_shard, plan_recovery]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_recovery.result == 'success' && needs.plan_recovery.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_recovery.outputs.progress }}

  recover_wave_02:
    name: "接手 02｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_wave_02]
    if: ${{ !cancelled() && needs.plan_wave_02.result == 'success' && needs.plan_wave_02.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_wave_02.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '2'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w02
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_wave_03:
    name: 任務池檢查｜接手輪次 03
    needs: [discover_once, recover_wave_02, plan_wave_02]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_wave_02.result == 'success' && needs.plan_wave_02.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_wave_02.outputs.progress }}

  recover_wave_03:
    name: "接手 03｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_wave_03]
    if: ${{ !cancelled() && needs.plan_wave_03.result == 'success' && needs.plan_wave_03.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_wave_03.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '3'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w03
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_wave_04:
    name: 任務池檢查｜接手輪次 04
    needs: [discover_once, recover_wave_03, plan_wave_03]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_wave_03.result == 'success' && needs.plan_wave_03.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_wave_03.outputs.progress }}

  recover_wave_04:
    name: "接手 04｜工作機 ${{ matrix.worker }}"
    needs: [discover_once, plan_wave_04]
    if: ${{ !cancelled() && needs.plan_wave_04.result == 'success' && needs.plan_wave_04.outputs.missing_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_wave_04.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawl.txt
      - name: 安裝程式所需套件及逐店儲存工具
        run: |
          pip install -r requirements-crawl.txt
          npm install --prefix .github/actions/fr-dynamic-crawl --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
      - name: 下載同一份店家清單
        uses: actions/download-artifact@v4
        with:
          name: foodradar-shared-feed-${{ needs.discover_once.outputs.epoch }}
          path: data/discovery
      - name: 動態領取店家、獨立調整執行緒及逐店保存
        uses: ./.github/actions/fr-dynamic-crawl
        with:
          index: ${{ matrix.shard }}
        env:
          FR_CRAWL_WAVE: '4'
          FOODRADAR_INITIAL_THREADS: ${{ needs.discover_once.outputs.initial_threads }}
          FOODRADAR_PARALLEL_SECTIONS: '1'
          FOODRADAR_CATALOG_429_RETRIES: '10'
          FOODRADAR_STORE_RETRIES: '9'
      - name: 上傳本機執行緒學習與請求統計
        uses: actions/upload-artifact@v4
        with:
          name: fr-worker-${{ needs.discover_once.outputs.epoch }}-${{ matrix.shard }}-w04
          path: data/worker-summary-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
          compression-level: 1


  plan_wave_05:
    name: 任務池檢查｜接手輪次 05
    needs: [discover_once, recover_wave_04, plan_wave_04]
    if: ${{ !cancelled() && needs.discover_once.result == 'success' && needs.plan_wave_04.result == 'success' && needs.plan_wave_04.outputs.missing_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      progress: ${{ steps.plan.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fr-crawl-plan
        id: plan
        with:
          epoch: ${{ needs.discover_once.outputs.epoch }}
          previous-progress: ${{ needs.plan_wave_04.outputs.progress }}

  recover_wave_05:
    name: "接手 05｜工作機 ${{ matrix.worker }}"
