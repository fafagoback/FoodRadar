name: FoodRadar｜工作資料庫實測
on:
  push:
    branches: [diagnostic/working-db]
permissions:
  contents: read
  actions: read
concurrency:
  group: foodradar-working-db
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 讀取正式18.92MB快取
        uses: actions/cache/restore@v4
        with:
          path: data/state-checkpoint/
          key: foodradar-state-v1-45334737716-1
          fail-on-cache-miss: true
      - name: 安裝依賴與完整回歸測試
        run: |
          python -m pip install -q -r requirements.txt
          python -m unittest discover -s tests -v
          node tests/price_history.cjs
      - name: 實際資料逐筆比對、容量與靜態網站等價驗收
        run: python scripts/verify_working_db.py
      - name: 保存實測報告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: working-db-report
          path: working-db-report.json
          retention-days: 1
