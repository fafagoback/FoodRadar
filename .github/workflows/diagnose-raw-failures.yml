name: FoodRadar | Diagnose archived failed Raw captures
on:
  push:
    paths:
      - '.github/workflows/diagnose-raw-failures.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Inspect immutable original failed response codes (read only)
        shell: bash
        run: |
          python - <<'PY'
          import collections, io, json, os, tarfile, urllib.request
          batch = '20261110144253'
          base = f'https://huggingface.co/datasets/hub-google/FoodRadar/resolve/main/Raw/{batch}'
          def get(path):
              req = urllib.request.Request(base + '/' + path, headers={'Authorization':'Bearer '+os.environ['HF_TOKEN']})
              with urllib.request.urlopen(req, timeout=120) as res: return res.read()
          manifest = json.loads(get('manifest.json'))
          failures = [s for s in manifest['stores'] if not s.get('success')]
          blob = get('capture.tar.gz')
          print('ARCHIVED_FAILURES=' + json.dumps({'batch':batch,'all_stores':len(manifest['stores']),'failed_count':len(failures),'compressed_bytes':len(blob)}),flush=True)
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as archive:
              files={m.name:m for m in archive.getmembers() if m.isfile()}
              summary=collections.Counter()
              examples={}
              for fail in failures:
                  uuid=fail['store_uuid']
                  pagefiles=sorted(n for n in files if n.startswith(f'catalog/{uuid}/'))
                  if not pagefiles:
                      summary['NO_CATALOG_HTTP_CAPTURE']+=1
                      examples.setdefault('NO_CATALOG_HTTP_CAPTURE',[]).append(uuid)
                  for name in pagefiles:
                      b=archive.extractfile(files[name]).read()
                      try:
                          obj=json.loads(b)
                          data=obj.get('data') if isinstance(obj,dict) else None
                          detail=(data if isinstance(data,dict) else {})
                          key=(name.rsplit('-status-',1)[-1].split('.')[0],str(obj.get('status')) if isinstance(obj,dict) else type(obj).__name__,str(detail.get('code')),str(detail.get('message'))[:110], 'catalog' in detail, 'pagingInfo' in detail)
                      except Exception as exc:
                          key=('UNPARSEABLE',type(exc).__name__,'','','','')
                      summary[key]+=1
                      if len(examples.get(str(key),[]))<2:
                          examples.setdefault(str(key),[]).append({'store_uuid':uuid,'path':name,'response_start':b[:160].decode('utf-8','replace')})
              print('RAW_RESPONSE_ERROR_DISTRIBUTION=' + json.dumps([{'kind':str(k),'count':v,'examples':examples.get(str(k),[])} for k,v in summary.most_common(35)],ensure_ascii=False),flush=True)
          PY
