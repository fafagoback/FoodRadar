name: 標案資料｜公開來源同步（獨立）
run-name: '標案資料｜公開來源同步｜執行編號 #${{ github.run_number }}'
on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tender-public-source-sync.yml'
permissions:
  contents: read
concurrency:
  group: tender-public-hf-sync
  cancel-in-progress: false
jobs:
  public-source-archive:
    name: 直接同步公開標案資料（不經資料庫）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝官方來源與 HF API 套件
        run: python -m pip install 'requests>=2.32,<3' 'huggingface_hub>=0.30,<2'
      - name: 驗證與歸檔公開公告原始紀錄
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret configured. No records were modified."
            exit 1
          fi
          python OpenData/tender-intelligence-web/scripts/sync_openfun_daily_to_hf.py

  publish-searchable-parquet:
    name: 發布公開標案搜尋索引
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝資料格式與儲存套件
        run: python -m pip install 'pyarrow>=20,<24' 'huggingface_hub>=0.30,<2'
      - name: 發布已驗證的標案搜尋資料
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python OpenData/tender-intelligence-web/scripts/publish_parquet_to_hf.py

  verify-native-hf-api:
    name: 驗證公開資料搜尋、篩選與詳細內容
    if: github.event_name == 'push'
    needs: publish-searchable-parquet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝網路請求套件
        run: python -m pip install 'requests>=2.32,<3'
      - name: 驗證標案資料搜尋介面
        run: python OpenData/tender-intelligence-web/scripts/smoke_hf_dataset_api.py

  build-browser-public-packs:
    name: 建立獨立的公開標案查詢資料
    needs: public-source-archive
    if: github.event_name != 'workflow_dispatch' || !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝資料儲存套件
        run: python -m pip install 'huggingface_hub>=0.30,<2'
      - name: 上傳經完整性檢驗的查詢資料包
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python OpenData/tender-intelligence-web/scripts/build_hf_browser_index.py

  verify-static-hf-http:
    name: 檢查公開資料連線與檔案完整性
    needs: build-browser-public-packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - name: 準備程式執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證無後端服務的公開資料存取
        run: python OpenData/tender-intelligence-web/scripts/smoke_hf_browser_http.py

  report:
    name: 標案資料同步結果摘要
    if: always()
    needs: [public-source-archive, publish-searchable-parquet, verify-native-hf-api, build-browser-public-packs, verify-static-hf-http]
    runs-on: ubuntu-latest
    steps:
      - name: 產生繁體中文標案同步報告
        env:
          SYNC: ${{ needs.public-source-archive.result }}
          SEARCH: ${{ needs.publish-searchable-parquet.result }}
          SEARCH_CHECK: ${{ needs.verify-native-hf-api.result }}
          PUBLIC_DATA: ${{ needs.build-browser-public-packs.result }}
          PUBLIC_CHECK: ${{ needs.verify-static-hf-http.result }}
        run: |
          convert() { case "$1" in success) echo '成功';; failure) echo '失敗';; skipped) echo '未執行';; cancelled) echo '已取消';; *) echo '未確認';; esac; }
          {
            echo '## 標案資料｜公開來源同步執行報告'
            echo '| 指標 | 結果 |'
            echo '|---|---|'
            echo "| 公告原始資料同步 | $(convert "$SYNC") |"
            echo "| 搜尋索引發布 | $(convert "$SEARCH") |"
            echo "| 搜尋索引驗證 | $(convert "$SEARCH_CHECK") |"
            echo "| 公開查詢資料發布 | $(convert "$PUBLIC_DATA") |"
            echo "| 公開資料連線驗證 | $(convert "$PUBLIC_CHECK") |"
            echo '| 網站部署 | 本流程沒有部署網站 |'
          } >> "$GITHUB_STEP_SUMMARY"
