name: Tender HF｜公開標案來源增量封存（獨立）
on:
  schedule:
    - cron: '30 2,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tender-public-source-sync.yml'
permissions:
  contents: read
concurrency:
  group: tender-public-hf-sync
  cancel-in-progress: false
jobs:
  public-source-archive:
    name: 直接從公開來源同步到 HF Repositories（不使用 Supabase）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝官方來源與 HF API 套件
        run: python -m pip install 'requests>=2.32,<3' 'huggingface_hub>=0.30,<2'
      - name: 驗證與歸檔公開公告原始紀錄
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret configured. No records were modified."
            exit 1
          fi
          python OpenData/tender-intelligence-web/scripts/sync_openfun_daily_to_hf.py

  publish-searchable-parquet:
    name: Publish HF Public Parquet Search Index
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Parquet and Hugging Face SDK
        run: python -m pip install 'pyarrow>=20,<24' 'huggingface_hub>=0.30,<2'
      - name: Publish verified tender archives as HF-native searchable datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python OpenData/tender-intelligence-web/scripts/publish_parquet_to_hf.py

  verify-native-hf-api:
    name: HF Dataset Viewer search / filter / details live smoke test
    if: github.event_name == 'push'
    needs: publish-searchable-parquet
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: main
          path: OpenData
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Check Hugging Face public API after Parquet indexing
        run: python OpenData/tender-intelligence-web/scripts/smoke_hf_dataset_api.py
