name: FoodRadar Live Catalog Audit
on:
  push:
    paths:
      - 'scripts/audit_live_beitou_catalog.py'
      - '.github/workflows/live-catalog-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Probe actual Uber Eats category API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/audit_live_beitou_catalog.py
