name: Tender Public HF Repository Archive (one-time bridge)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tender-hf-public-bridge.yml"
permissions:
  contents: read
concurrency:
  group: tender-hf-public-export
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout independent OpenData archive exporter
        uses: actions/checkout@v4
        with:
          repository: hub-google/OpenData
          ref: 2dc50b3f720308548c7b39f17e551aaf3b5e7aac
          path: OpenData
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exporter syntax
        run: python -m py_compile OpenData/tender-intelligence-web/scripts/archive_public_to_hf.py
      - name: Install archive dependencies
        run: python -m pip install 'requests>=2.32,<3' 'huggingface_hub>=0.30,<2'
      - name: Upload verified public tender dataset repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: hub-google/TenderIntelligence
          SUPABASE_URL: https://unapiwajmgqqtdkixaab.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_L09XC4Tekm6cZaPTTczm3g_Aap-SOSy
        run: |
          test -n "$HF_TOKEN" || (echo "Existing HF_TOKEN unavailable" && exit 1)
          python OpenData/tender-intelligence-web/scripts/archive_public_to_hf.py
