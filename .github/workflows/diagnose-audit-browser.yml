name: FoodRadar Diagnostic | Uber Web Layout
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_audit_browser.py'
      - '.github/workflows/diagnose-audit-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests playwright pillow pytesseract
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/diagnose_audit_browser.py
